<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff & Worker Management Engine</title>

<!-- FontAwesome & Google Fonts -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --primary: #38bdf8;
    --success: #22c55e;
    --danger: #ef4444;
    --warning: #f59e0b;
    --bg-dark: #0f172a;
    --card-bg: rgba(30, 41, 59, 0.7);
    --border-color: rgba(255, 255, 255, 0.12);
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
body { background: var(--bg-dark); color: #f8fafc; padding: 20px; }

.header-title {
    font-size: 1.3rem;
    font-weight: 800;
    color: var(--primary);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 12px;
}

.card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
    backdrop-filter: blur(10px);
}

.card-title {
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 18px;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 10px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-bottom: 16px;
}

.form-group label {
    display: block;
    font-size: 0.85rem;
    margin-bottom: 6px;
    color: #94a3b8;
    font-weight: 600;
}

.form-group input, .form-group select {
    width: 100%;
    padding: 10px 12px;
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    color: #fff;
    outline: none;
}

.btn {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.btn-primary { background: linear-gradient(135deg, #38bdf8, #2563eb); color: #fff; }
.btn-info { background: rgba(56, 189, 248, 0.2); color: var(--primary); border: 1px solid var(--primary); }
.btn-danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }

/* Staff Table */
.staff-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
.staff-table th, .staff-table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 0.88rem; }
.staff-table th { color: #94a3b8; background: rgba(0,0,0,0.25); }

.avatar-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }
.badge-status { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; }
.status-active { background: rgba(34, 197, 94, 0.2); color: var(--success); }
.status-pending { background: rgba(245, 158, 11, 0.2); color: var(--warning); }

/* Modal Styling for Worker Profile */
.modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.8);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 999;
    padding: 15px;
}
.modal-box {
    background: #0f172a;
    border: 1px solid var(--border-color);
    border-radius: 16px;
    width: 100%;
    max-width: 550px;
    padding: 20px;
    max-height: 90vh;
    overflow-y: auto;
}
.modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 15px; }
.modal-close { background: none; border: none; color: #ef4444; font-size: 1.2rem; cursor: pointer; }
.profile-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; font-size: 0.85rem; }
.profile-item { background: rgba(30, 41, 59, 0.7); padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
.profile-item label { color: #94a3b8; display: block; font-size: 0.75rem; font-weight: 600; }
.profile-item span { color: #fff; font-weight: 700; }
</style>
</head>
<body>

<div class="header-title">
    <i class="fa-solid fa-user-gear"></i> Staff & Field Worker Engine
</div>

<!-- ADD / INVITE WORKER CARD -->
<div class="card">
    <div class="card-title">
        <i class="fa-solid fa-user-plus" style="color:var(--primary);"></i> नया वर्कर जोड़ें एवं इनवाइट भेजें (Add Worker & Send Link)
    </div>

    <div class="form-grid">
        <div class="form-group">
            <label>वर्कर का नाम (Worker Name)</label>
            <input type="text" id="workerName" placeholder="उदा. राहुल कुमार">
        </div>

        <div class="form-group">
            <label>व्हाट्सएप / फोन नंबर (WhatsApp Phone)</label>
            <input type="tel" id="workerPhone" placeholder="उदा. 9838715205">
        </div>

        <div class="form-group">
            <label>पद / रोल (Worker Role)</label>
            <select id="workerRole">
                <option value="Field Technician">Field Technician (फ़ाइबर स्प्लिसिंग व फ़ील्ड काम)</option>
                <option value="Complaint Resolver">Complaint Resolver (शिकायत निवारण ऑपरेटर)</option>
                <option value="Collection Agent">Collection Agent (पेमेंट वसूली एजेंट)</option>
                <option value="Network Supervisor">Network Supervisor (नेटवर्क सुपरवाइजर)</option>
            </select>
        </div>
    </div>

    <button class="btn btn-primary" onclick="generateAndSendInvite()">
        <i class="fa-brands fa-whatsapp"></i> व्हाट्सएप पर इनवाइट लिंक भेजें (Send Invite Link)
    </button>
</div>

<!-- WORKER LIST TABLE -->
<div class="card">
    <div class="card-title">
        <i class="fa-solid fa-users-gear" style="color:var(--primary);"></i> एक्टिव वर्कर लिस्ट एवं बायोडाटा (Active Staff & CV Details)
    </div>

    <table class="staff-table">
        <thead>
            <tr>
                <th>फोटो</th>
                <th>नाम व पद</th>
                <th>फोन नंबर</th>
                <th>अनुभव व स्किल्स</th>
                <th>स्टेटस</th>
                <th>एक्शन</th>
            </tr>
        </thead>
        <tbody id="workerTableBody">
            <!-- Data will load here -->
        </tbody>
    </table>
</div>

<!-- WORKER PROFILE MODAL -->
<div class="modal-overlay" id="profileModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3 style="color:var(--primary); font-size:1.1rem;"><i class="fa-solid fa-id-card"></i> वर्कर संपूर्ण बायोडाटा</h3>
            <button class="modal-close" onclick="closeProfileModal()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <div style="text-align:center; margin-bottom:15px;">
            <img id="mPhoto" src="" style="width:80px; height:80px; border-radius:50%; border:3px solid var(--primary); object-fit:cover;">
            <h4 id="mName" style="color:#fff; margin-top:8px;"></h4>
            <p id="mRole" style="color:#94a3b8; font-size:0.8rem;"></p>
        </div>

        <div class="profile-grid">
            <div class="profile-item"><label>पिता का नाम</label><span id="mFather"></span></div>
            <div class="profile-item"><label>माता का नाम</label><span id="mMother"></span></div>
            <div class="profile-item"><label>फोन नंबर</label><span id="mPhone"></span></div>
            <div class="profile-item"><label>वैवाहिक स्थिति</label><span id="mMarital"></span></div>
            <div class="profile-item"><label>आधार विवरण</label><span id="mAadhaar"></span></div>
            <div class="profile-item"><label>अनुभव</label><span id="mExp"></span></div>
        </div>

        <div class="profile-item" style="margin-top:10px;">
            <label>वर्तमान पता</label><span id="mAddress"></span>
        </div>

        <div class="profile-item" style="margin-top:10px;">
            <label>मुख्य स्किल्स</label><span id="mSkills"></span>
        </div>
    </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyCVsmFa6Xr-_EfUqh_ZS6tmzBwcdMZq0JA",
    authDomain: "universal-portal-dashboard.firebaseapp.com",
    projectId: "universal-portal-dashboard",
    storageBucket: "universal-portal-dashboard.firebasestorage.app",
    messagingSenderId: "403036962443",
    appId: "1:403036962443:web:5a15ac684c76efd2c3de8e"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}

function generateAndSendInvite() {
    const name = document.getElementById('workerName').value.trim();
    const phone = document.getElementById('workerPhone').value.trim();
    const role = document.getElementById('workerRole').value;

    if (!name || !phone) {
        alert("कृपया वर्कर का नाम और व्हाट्सएप नंबर भरें!");
        return;
    }

    const operatorIspName = localStorage.getItem('isp_name') || 'Universal Operator Portal';

    const newWorker = {
        name: name,
        phone: phone,
        role: role,
        operatorName: operatorIspName,
        status: "Pending Registration",
        skills: "Pending Profile Fill",
        experience: "Pending",
        photoUrl: "https://i.ibb.co/cKBTN905/IMG-20260821-WA0005.jpg",
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    firebase.firestore().collection("workers").add(newWorker).then((docRef) => {
        // Vercel Live Deployment URL Path Alignment
        const baseUrl = 'https://universal-operator-portal.vercel.app';
        const inviteUrl = `${baseUrl}/worker-signup.html?workerId=${docRef.id}`;
        
        const message = `नमस्ते ${name}! ${operatorIspName} पोर्टल पर आपको ${role} के रूप में जोड़ा गया है। अपना प्रोफ़ाइल एवं बायोडाटा (CV) पूरा करने के लिए नीचे दिए गए लिंक पर क्लिक करें:\n\n${inviteUrl}`;
        
        window.open(`https://wa.me/91${phone}?text=${encodeURIComponent(message)}`, '_blank');
        
        document.getElementById('workerName').value = '';
        document.getElementById('workerPhone').value = '';
        loadWorkers();
    }).catch(err => alert("Error: " + err.message));
}

let workersDataMap = {};

function loadWorkers() {
    const tbody = document.getElementById('workerTableBody');
    tbody.innerHTML = '<tr><td colspan="6">डेटा लोड हो रहा है...</td></tr>';

    firebase.firestore().collection("workers").onSnapshot((snapshot) => {
        tbody.innerHTML = '';
        workersDataMap = {};
        if(snapshot.empty) {
            tbody.innerHTML = '<tr><td colspan="6">कोई वर्कर नहीं मिला। ऊपर से नया वर्कर जोड़ें।</td></tr>';
            return;
        }

        snapshot.forEach((doc) => {
            const w = doc.data();
            const id = doc.id;
            workersDataMap[id] = w;

            tbody.innerHTML += `
                <tr>
                    <td><img src="${w.photoUrl || 'https://i.ibb.co/cKBTN905/IMG-20260821-WA0005.jpg'}" class="avatar-img" alt="Photo"></td>
                    <td><strong>${w.name}</strong><br><small style="color:#94a3b8;">${w.role}</small></td>
                    <td>${w.phone}</td>
                    <td>${w.skills || 'Pending'}<br><small style="color:#fbbf24;">${w.experience || 'Pending'}</small></td>
                    <td><span class="badge-status ${w.status === 'Active' ? 'status-active' : 'status-pending'}">${w.status}</span></td>
                    <td>
                        <button class="btn btn-info" style="padding:4px 8px; font-size:0.75rem; margin-right:4px;" onclick="viewWorkerProfile('${id}')">
                            <i class="fa-solid fa-eye"></i> देखना
                        </button>
                        <button class="btn btn-danger" style="padding:4px 8px; font-size:0.75rem;" onclick="removeWorker('${id}')">
                            <i class="fa-solid fa-trash"></i> हटाएँ
                        </button>
                    </td>
                </tr>
            `;
        });
    });
}

function viewWorkerProfile(workerId) {
    const w = workersDataMap[workerId];
    if(!w) return;

    document.getElementById('mPhoto').src = w.photoUrl || "https://i.ibb.co/cKBTN905/IMG-20260821-WA0005.jpg";
    document.getElementById('mName').innerText = w.name || "N/A";
    document.getElementById('mRole').innerText = w.role || "Technician";
    document.getElementById('mFather').innerText = w.fatherName || "Pending";
    document.getElementById('mMother').innerText = w.motherName || "Pending";
    document.getElementById('mPhone').innerText = w.phone || "N/A";
    document.getElementById('mMarital').innerText = w.maritalStatus || "Pending";
    document.getElementById('mAadhaar').innerText = "[Aadhaar Redacted]";
    document.getElementById('mExp').innerText = w.experience || "Pending";
    document.getElementById('mAddress').innerText = w.address || "Pending";
    document.getElementById('mSkills').innerText = w.skills || "Pending";

    document.getElementById('profileModal').style.display = 'flex';
}

function closeProfileModal() {
    document.getElementById('profileModal').style.display = 'none';
}

function removeWorker(workerId) {
    if (confirm("क्या आप सचमुच इस वर्कर को हटाना चाहते हैं? हटने के बाद यह सब-डैशबोर्ड एक्सेस नहीं कर पाएगा।")) {
        firebase.firestore().collection("workers").doc(workerId).delete().then(() => {
            alert("वर्कर को सफलतापूर्वक हटा दिया गया है!");
        });
    }
}

window.onload = function() {
    loadWorkers();
};
</script>
</body>
              </html>
