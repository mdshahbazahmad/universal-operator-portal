<!doctype html>
<html lang="hi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff & Worker Management</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>
:root{--primary:#38bdf8;--bg:#0f172a;--card:#1e293b;--border:#ffffff20}*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--bg);color:#f8fafc;font:14px system-ui,sans-serif}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:17px;margin-bottom:16px}.heading{color:var(--primary)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.field label{display:block;color:#94a3b8;margin-bottom:5px}.field input,.field select{width:100%;padding:10px;background:#0f172a;color:white;border:1px solid var(--border);border-radius:8px}button{background:var(--primary);color:#082f49;border:0;border-radius:8px;padding:9px 13px;font-weight:700;cursor:pointer}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--border)}.badge{padding:4px 8px;border-radius:7px;background:#78350f;color:#fde68a}.active{background:#14532d;color:#bbf7d0}.avatar{width:40px;height:40px;object-fit:cover;border-radius:50%}.error{color:#fecaca}.hint{color:#94a3b8}
</style></head><body><h1 class="heading"><i class="fa fa-users-gear"></i> Staff & Field Worker Management</h1><section class="card"><h2>Invite a worker</h2><p class="hint">Create an operator-owned invite. The invite link binds the worker’s authenticated Firebase UID to this record.</p><div class="grid"><div class="field"><label>Worker name</label><input id="workerName" maxlength="100"></div><div class="field"><label>Phone</label><input id="workerPhone" type="tel" maxlength="20"></div><div class="field"><label>Role</label><select id="workerRole"><option>Field Technician</option><option>Complaint Resolver</option><option>Collection Agent</option><option>Network Supervisor</option></select></div></div><button id="inviteButton" onclick="generateInvite()"><i class="fa fa-link"></i> Create invite & open WhatsApp</button><p id="message" class="error" role="status"></p></section><section class="card"><h2>Workers</h2><div class="table-wrap"><table><thead><tr><th>Photo</th><th>Name / Role</th><th>Phone</th><th>Skills / Qualification</th><th>Status</th><th>Profile</th></tr></thead><tbody id="workers"><tr><td colspan="6">Loading…</td></tr></tbody></table></div></section>
<div id="modal" style="display:none;position:fixed;inset:0;background:#000c;place-items:center;padding:15px"><article style="background:#0f172a;padding:20px;border-radius:12px;width:min(600px,100%);max-height:90vh;overflow:auto"><button style="float:right" onclick="document.getElementById('modal').style.display='none'">Close</button><h2 id="mName"></h2><div id="mDetails"></div></article></div>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script><script>
const cfg={apiKey:'AIzaSyCVsmFa6Xr-_EfUqh_ZS6tmzBwcdMZq0JA',authDomain:'universal-portal-dashboard.firebaseapp.com',projectId:'universal-portal-dashboard',storageBucket:'universal-portal-dashboard.firebasestorage.app',messagingSenderId:'403036962443',appId:'1:403036962443:web:5a15ac684c76efd2c3de8e'};if(!firebase.apps.length)firebase.initializeApp(cfg);let operator=null,workers=[];const db=firebase.firestore(),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));firebase.auth().onAuthStateChanged(async user=>{if(!user){location.href='../index.html';return}operator=user;try{const opRef=db.collection('operators').doc(user.uid),op=await opRef.get();if(!op.exists){const userDoc=await db.collection('users').doc(user.uid).get();await opRef.set({uid:user.uid,companyName:userDoc.exists?(userDoc.data().name||''):'',email:user.email||'',createdAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})}db.collection('workers').where('operatorUid','==',user.uid).onSnapshot(s=>{workers=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>document.getElementById('message').textContent=e.message)}catch(e){document.getElementById('message').textContent=e.message}});async function generateInvite(){if(!operator)return;const name=document.getElementById('workerName').value.trim(),phone=document.getElementById('workerPhone').value.trim(),role=document.getElementById('workerRole').value;if(!name||!phone){alert('Enter worker name and phone.');return}const button=document.getElementById('inviteButton');button.disabled=true;try{const random=new Uint8Array(24);crypto.getRandomValues(random);const token=Array.from(random,x=>x.toString(16).padStart(2,'0')).join('');const operatorDoc=await db.collection('operators').doc(operator.uid).get(),operatorName=operatorDoc.exists?operatorDoc.data().companyName||'Your operator':'Your operator';const ref=await db.collection('workers').add({operatorUid:operator.uid,name,phone,role,operatorName,uid:'',email:'',skills:'',qualification:'',experience:'',address:'',status:'Pending Registration',inviteToken:token,createdAt:firebase.firestore.FieldValue.serverTimestamp()});const url=new URL('../worker-signup.html',location.href);url.searchParams.set('workerId',ref.id);url.searchParams.set('token',token);url.searchParams.set('name',name);url.searchParams.set('phone',phone);const message=`Hello ${name}, you have been invited as ${role} by ${operatorName}. Complete your profile and create your worker login: ${url.href}`;window.open(`https://wa.me/${phone.replace(/\D/g,'')}?text=${encodeURIComponent(message)}`,'_blank','noopener');document.getElementById('workerName').value='';document.getElementById('workerPhone').value=''}catch(e){alert('Invite failed: '+e.message)}finally{button.disabled=false}}function render(){const body=document.getElementById('workers');body.innerHTML='';if(!workers.length){body.innerHTML='<tr><td colspan="6">No workers have been added.</td></tr>';return}workers.forEach(w=>{const tr=document.createElement('tr');tr.innerHTML=`<td><img class="avatar" src="${esc(w.photoUrl||'https://via.placeholder.com/40')}" alt=""></td><td><strong>${esc(w.name||'Worker')}</strong><br><span class="hint">${esc(w.role||'Technician')}</span></td><td>${esc(w.phone||'—')}</td><td>${esc(w.skills||'—')}<br><span class="hint">${esc(w.qualification||'')}</span></td><td><span class="badge ${w.status==='Active'?'active':''}">${esc(w.status||'Pending profile')}</span></td><td><button data-id="${esc(w.id)}">View</button></td>`;tr.querySelector('button').onclick=()=>viewWorker(w);body.appendChild(tr)})}function viewWorker(w){document.getElementById('mName').textContent=w.name||'Worker profile';const fields={ID:w.id,Phone:w.phone,Gender:w.gender,Qualification:w.qualification,Address:w.address,Skills:w.skills,Experience:w.experience,'Previous work':w.previousWork,'Date of birth':w.dob,'Marital status':w.maritalStatus,Status:w.status};document.getElementById('mDetails').innerHTML=Object.entries(fields).map(([k,v])=>`<p><strong>${esc(k)}:</strong> ${esc(v||'Not provided')}</p>`).join('')+'<p><strong>Aadhaar:</strong> Not visible in operator portal</p>';document.getElementById('modal').style.display='grid'}
</script></body></html>
