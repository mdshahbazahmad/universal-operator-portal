<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Branding & Settings</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>
:root{--primary:#38bdf8}*{box-sizing:border-box}body{margin:0;padding:18px;background:#0f172a;color:#f8fafc;font:15px system-ui,sans-serif}.card{max-width:760px;margin:auto;background:#1e293b;border:1px solid #ffffff20;border-radius:14px;padding:20px}h1{color:var(--primary)}label{display:block;color:#cbd5e1;margin:13px 0 5px}input{padding:10px;border-radius:8px;border:1px solid #ffffff30;background:#0f172a;color:white;max-width:100%}input[type=text],input[type=tel]{width:100%}.preview{display:flex;align-items:center;gap:12px;margin:15px 0}.preview img{width:54px;height:54px;border-radius:50%;object-fit:cover;border:2px solid var(--primary)}button{margin-top:16px;background:var(--primary);color:#082f49;border:0;padding:11px 16px;border-radius:8px;font-weight:700;cursor:pointer}.message{margin-left:10px;color:#86efac}.hint{font-size:.83rem;color:#94a3b8}
</style></head><body><main class="card"><h1><i class="fa fa-paintbrush"></i> Company branding</h1><p class="hint">Settings are saved to the signed-in operator’s Firestore document and applied to the portal.</p><div class="preview"><img id="logoPreview" src="https://i.ibb.co/cKBTN905/IMG-20260821-WA0005.jpg" alt="Company logo"><strong id="namePreview">Company name</strong></div><label for="companyName">Company name</label><input id="companyName" type="text" maxlength="80"><label for="logoUrl">Logo URL (optional)</label><input id="logoUrl" type="text" maxlength="1000" placeholder="https://…"><label for="logoFile">Or upload a logo image (max 300 KB)</label><input id="logoFile" type="file" accept="image/*"><label for="themeColor">Primary theme color</label><input id="themeColor" type="color" value="#38bdf8"><div><button onclick="saveBranding()">Save branding</button><span id="message" class="message" role="status"></span></div></main>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script><script>
const cfg={apiKey:'AIzaSyCVsmFa6Xr-_EfUqh_ZS6tmzBwcdMZq0JA',authDomain:'universal-portal-dashboard.firebaseapp.com',projectId:'universal-portal-dashboard',storageBucket:'universal-portal-dashboard.firebasestorage.app',messagingSenderId:'403036962443',appId:'1:403036962443:web:5a15ac684c76efd2c3de8e'};if(!firebase.apps.length)firebase.initializeApp(cfg);let uid=null,logoValue='';firebase.auth().onAuthStateChanged(user=>{if(!user){document.getElementById('message').textContent='Sign in required.';return}uid=user.uid;firebase.firestore().collection('operators').doc(uid).onSnapshot(doc=>{const b=doc.exists?doc.data():{};document.getElementById('companyName').value=b.companyName||'';document.getElementById('logoUrl').value=b.logoUrl&&!b.logoUrl.startsWith('data:')?b.logoUrl:'';logoValue=b.logoUrl||'';if(b.logoUrl)document.getElementById('logoPreview').src=b.logoUrl;if(/^#[0-9a-f]{6}$/i.test(b.themeColor||''))document.getElementById('themeColor').value=b.themeColor;preview()})});function preview(){document.getElementById('namePreview').textContent=document.getElementById('companyName').value||'Company name';const url=document.getElementById('logoUrl').value.trim();if(url)document.getElementById('logoPreview').src=url}document.getElementById('companyName').addEventListener('input',preview);document.getElementById('logoUrl').addEventListener('input',preview);document.getElementById('logoFile').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(!file.type.startsWith('image/')||file.size>300*1024){e.target.value='';alert('Image must be 300 KB or smaller.');return}const reader=new FileReader();reader.onload=()=>{logoValue=reader.result;document.getElementById('logoPreview').src=logoValue;document.getElementById('logoUrl').value=''};reader.readAsDataURL(file)});async function saveBranding(){const msg=document.getElementById('message');try{if(!uid)throw new Error('Sign in required.');const name=document.getElementById('companyName').value.trim();if(!name)throw new Error('Company name is required.');const url=document.getElementById('logoUrl').value.trim();const logo=url||logoValue;if(logo&&!logo.startsWith('data:image/')&&!/^https:\/\//i.test(logo))throw new Error('Use an HTTPS logo URL or upload an image.');await firebase.firestore().collection('operators').doc(uid).set({uid,companyName:name,logoUrl:logo,themeColor:document.getElementById('themeColor').value,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});msg.textContent='Saved.'}catch(err){msg.textContent=err.message}}
</script></body></html>
