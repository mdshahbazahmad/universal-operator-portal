<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complaints & Field Tracker</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--primary:#38bdf8}*{box-sizing:border-box}body{margin:0;padding:16px;background:#0f172a;color:#f8fafc;font:14px system-ui,sans-serif}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:850px){.grid{grid-template-columns:1fr}}.card{padding:16px;background:#1e293b;border:1px solid #ffffff20;border-radius:14px;margin-bottom:15px}h1,h2{color:var(--primary);font-size:1.15rem}label{display:block;color:#cbd5e1;margin:10px 0 4px}input,textarea,select{width:100%;padding:9px;background:#0f172a;color:white;border:1px solid #ffffff25;border-radius:7px}button{padding:9px 13px;border:0;border-radius:7px;background:var(--primary);color:#082f49;font-weight:700;cursor:pointer;margin-top:10px}.ticket{border:1px solid #ffffff20;border-radius:9px;padding:12px;margin:10px 0}.muted{color:#94a3b8}.status{color:#fcd34d}.done{color:#86efac}#map{height:300px;border-radius:10px}</style></head><body><h1><i class="fa fa-headset"></i> Complaints & Field Tracker</h1><div class="grid"><section><div class="card"><h2>New complaint</h2><form onsubmit="createComplaint(event)"><label>Customer name</label><input id="customerName" required maxlength="100"><label>Phone</label><input id="customerPhone" type="tel" required maxlength="20"><label>Address</label><input id="address" maxlength="300"><div style="display:flex;gap:8px"><div style="flex:1"><label>Latitude</label><input id="lat" type="number" step="any"></div><div style="flex:1"><label>Longitude</label><input id="lng" type="number" step="any"></div></div><label>Issue</label><textarea id="issue" rows="3" required maxlength="1000"></textarea><button type="submit">Create ticket</button></form></div><div class="card"><h2>Workers</h2><div id="workers">Loading…</div></div></section><section><div class="card"><h2>Ticket locations</h2><div id="map"></div></div><div class="card"><h2>Live complaints</h2><div id="complaints">Loading…</div></div></section></div><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const cfg={apiKey:'AIzaSyCVsmFa6Xr-_EfUqh_ZS6tmzBwcdMZq0JA',authDomain:'universal-portal-dashboard.firebaseapp.com',projectId:'universal-portal-dashboard',storageBucket:'universal-portal-dashboard.firebasestorage.app',messagingSenderId:'403036962443',appId:'1:403036962443:web:5a15ac684c76efd2c3de8e'};if(!firebase.apps.length)firebase.initializeApp(cfg);const db=firebase.firestore();let operatorUid=null,workers=[],complaints=[],markers=[],map;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));firebase.auth().onAuthStateChanged(user=>{if(!user){location.href='../index.html';return}operatorUid=user.uid;map=L.map('map').setView([28.6139,77.209],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);db.collection('workers').where('operatorUid','==',operatorUid).onSnapshot(s=>{workers=s.docs.map(d=>({id:d.id,...d.data()}));renderWorkers();renderComplaints()},showError);db.collection('complaints').where('operatorUid','==',operatorUid).onSnapshot(s=>{complaints=s.docs.map(d=>({id:d.id,...d.data()}));renderComplaints()},showError);db.collection('operators').doc(operatorUid).onSnapshot(d=>{const color=d.exists?d.data().themeColor:'';if(/^#[0-9a-f]{6}$/i.test(color||''))document.documentElement.style.setProperty('--primary',color)})});function showError(e){document.getElementById('complaints').textContent=`Firestore error: ${e.message}`}async function createComplaint(e){e.preventDefault();try{await db.collection('complaints').add({operatorUid,ticketNo:'#TKT-'+Date.now().toString().slice(-8),customerName:document.getElementById('customerName').value.trim(),customerPhone:document.getElementById('customerPhone').value.trim(),address:document.getElementById('address').value.trim(),lat:Number(document.getElementById('lat').value)||null,lng:Number(document.getElementById('lng').value)||null,issue:document.getElementById('issue').value.trim(),status:'Pending',assignedWorkerId:'',source:'Portal',createdAt:firebase.firestore.FieldValue.serverTimestamp()});e.target.reset()}catch(err){alert(err.message)}}function renderWorkers(){const root=document.getElementById('workers');if(!workers.length){root.textContent='No workers found for this operator.';return}root.innerHTML='';workers.forEach(w=>{const row=document.createElement('p');row.textContent=`${w.name||'Worker'} · ${w.phone||'—'} · ${w.status||'Pending'}`;root.appendChild(row)})}async function assign(id,workerUid){try{await db.collection('complaints').doc(id).update({assignedWorkerId:workerUid||'',updatedAt:firebase.firestore.FieldValue.serverTimestamp()})}catch(e){alert(`Assignment failed: ${e.message}`)}}async function solve(id){const action=prompt('Work completed (optional):','Resolved');if(action===null)return;try{await db.collection('complaints').doc(id).update({status:'Done',actionTaken:action,resolvedAt:firebase.firestore.FieldValue.serverTimestamp()})}catch(e){alert(e.message)}}function renderComplaints(){const root=document.getElementById('complaints');if(!root)return;root.innerHTML='';markers.forEach(m=>map&&map.removeLayer(m));markers=[];if(!complaints.length){root.textContent='No complaints yet.';return}complaints.forEach(c=>{const worker=workers.find(w=>(w.uid||w.id)===c.assignedWorkerId),done=['Done','Solved','Resolved','Completed'].includes(c.status),item=document.createElement('article');item.className='ticket';const options='<option value="">Unassigned</option>'+workers.filter(w=>w.uid).map(w=>`<option value="${esc(w.uid)}" ${w.uid===c.assignedWorkerId?'selected':''}>${esc(w.name||'Worker')}</option>`).join('');item.innerHTML=`<strong>${esc(c.ticketNo||c.id)}</strong> · <span class="${done?'done':'status'}">${done?'Solved':'Pending'}</span><p>${esc(c.customerName)} · ${esc(c.customerPhone)}</p><p>${esc(c.address)}<br>${esc(c.issue)}</p><label>Assign worker</label><select>${options}</select>${worker?`<p class="muted">Assigned: ${esc(worker.name)}</p>`:''}${done?'':`<button>Mark solved</button>`}`;item.querySelector('select').onchange=e=>assign(c.id,e.target.value);const btn=item.querySelector('button');if(btn)btn.onclick=()=>solve(c.id);root.appendChild(item);const lat=Number(c.lat),lng=Number(c.lng);if(map&&Number.isFinite(lat)&&Number.isFinite(lng)&&lat&&lng)markers.push(L.marker([lat,lng]).addTo(map).bindPopup(`${esc(c.ticketNo)} · ${esc(c.customerName)}`))})}
</script></body></html>
