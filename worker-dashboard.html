<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worker Dashboard & Profile Portal</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --primary: #38bdf8;
    --success: #22c55e;
    --danger: #ef4444;
    --warning: #f59e0b;
    --bg-dark: #0f172a;
    --card-bg: rgba(30, 41, 59, 0.85);
    --border-color: rgba(255, 255, 255, 0.12);
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
body { background: var(--bg-dark); color: #f8fafc; padding: 15px; max-width: 800px; margin: 0 auto; }

/* Header Section */
.header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 20px; }
.user-profile-header { display: flex; align-items: center; gap: 15px; }
.avatar-wrapper { position: relative; width: 60px; height: 60px; }
.avatar { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }

/* Card Styling */
.card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; margin-bottom: 20px; backdrop-filter: blur(10px); }
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
.card-title { color: var(--primary); font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }

/* Form Fields */
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.form-group label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 5px; font-weight: 600; }
.form-group input, .form-group select { width: 100%; padding: 10px; background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border-color); border-radius: 8px; color: #fff; outline: none; font-size: 0.9rem; }
.form-group input:disabled, .form-group select:disabled { opacity: 0.6; cursor: not-allowed; background: rgba(15, 23, 42, 0.4); }

/* Buttons */
.btn { padding: 10px 16px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; color: #fff; font-size: 0.85rem; }
.btn-primary { background: linear-gradient(135deg, #38bdf8, #2563eb); }
.btn-success { background: linear-gradient(135deg, #22c55e, #15803d); }
.btn-danger { background: linear-gradient(135deg, #ef4444, #b91c1c); }
.btn-warning { background: linear-gradient(135deg, #f59e0b, #d97706); }

/* Complaints List Table */
.complaint-item { background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
.badge-done { background: rgba(34, 197, 94, 0.2); color: #22c55e; border: 1px solid #22c55e; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; }
.badge-pending { background: rgba(245, 158, 11, 0.2); color: #f59e0b; border: 1px solid #f59e0b; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; }
</style>
</head>
<body>

<!-- HEADER SECTION -->
<div class="header">
    <div class="user-profile-header">
        <div class="avatar-wrapper">
            <img id="displayDp" src="https://i.ibb.co/cKBTN905/IMG-20260821-WA0005.jpg" class="avatar" alt="Profile DP">
        </div>
        <div>
            <h2 id="displayName" style="color:#fff; font-size:1.2rem;">लोड हो रहा है...</h2>
            <p id="displayRole" style="color:var(--primary); font-size:0.82rem; font-weight:600;"></p>
        </div>
    </div>
    <button class="btn btn-danger" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> लॉगआउट</button>
</div>

<!-- ATTENDANCE CARD -->
<div class="card">
    <div class="card-title"><i class="fa-solid fa-clock"></i> दैनिक डिजिटल अटेंडेंस (Push IN / Push OUT)</div>
    <p style="font-size:0.85rem; color:#94a3b8; margin: 10px 0;" id="attStatusText">हाजिरी की स्थिति जाँची जा रही है...</p>
    <div style="display:flex; gap:12px; flex-wrap:wrap;">
        <button class="btn btn-success" id="btnIn" onclick="punchIn()"><i class="fa-solid fa-location-dot"></i> Push IN (आगमन)</button>
        <button class="btn btn-danger" id="btnOut" onclick="punchOut()" disabled><i class="fa-solid fa-person-walking-arrow-right"></i> Push OUT (प्रस्थान)</button>
    </div>
</div>

<!-- PROFILE / BIODATA CARD WITH EDIT TOGGLE -->
<div class="card">
    <div class="card-header">
        <div class="card-title"><i class="fa-solid fa-user-gear"></i> मेरी प्रोफाइल विवरण (Profile & Biodata)</div>
        <button class="btn btn-warning" id="editToggleBtn" onclick="toggleEditMode()"><i class="fa-solid fa-pen-to-square"></i> एडिट करें (Edit)</button>
    </div>

    <div class="form-grid">
        <div class="form-group" style="grid-column: 1 / -1;">
            <label>प्रोफ़ाइल फोटो URL (Profile DP)</label>
            <input type="text" id="photoUrl" placeholder="अपनी फोटो का URL यहाँ दर्ज करें" disabled>
        </div>
        <div class="form-group">
            <label>पूरा नाम (Full Name)</label>
            <input type="text" id="workerName" disabled>
        </div>
        <div class="form-group">
            <label>फ़ोन / व्हाट्सएप नंबर (Phone)</label>
            <input type="tel" id="workerPhone" disabled>
        </div>
        <div class="form-group">
            <label>पिता का नाम (Father's Name)</label>
            <input type="text" id="fatherName" disabled>
        </div>
        <div class="form-group">
            <label>माता का नाम (Mother's Name)</label>
            <input type="text" id="motherName" disabled>
        </div>
        <div class="form-group">
            <label>जन्मतिथि (Date of Birth)</label>
            <input type="date" id="dob" disabled>
        </div>
        <div class="form-group">
            <label>वैवाहिक स्थिति (Marital Status)</label>
            <select id="maritalStatus" disabled>
                <option value="Unmarried">अविवाहित (Unmarried)</option>
                <option value="Married">विवाहित (Married)</option>
            </select>
        </div>
        <div class="form-group">
            <label>पिछली बार कहाँ काम किया? (Previous Work Location)</label>
            <input type="text" id="previousWork" placeholder="उदा. एटीएल नेटवर्क्स, दिल्ली" disabled>
        </div>
        <div class="form-group">
            <label>अनुभव (Experience)</label>
            <input type="text" id="experience" placeholder="उदा. 3 साल" disabled>
        </div>
        <div class="form-group">
            <label>मुख्य हुनर / स्किल्स (Skills)</label>
            <input type="text" id="skills" placeholder="उदा. Fiber Splicing, OTDR, Wiring" disabled>
        </div>
    </div>

    <button class="btn btn-primary" id="saveProfileBtn" style="margin-top:20px; width:100%; justify-content:center; display:none;" onclick="saveProfileData()">
        <i class="fa-solid fa-floppy-disk"></i> प्रोफाइल सेव करें (Save Changes)
    </button>
</div>

<!-- COMPLAINTS LIVE STATUS TRACKING CARD -->
<div class="card">
    <div class="card-title"><i class="fa-solid fa-headset"></i> फील्ड शिकायतें और ऑपरेटर स्टेटस (Complaints Status)</div>
    <p style="font-size:0.82rem; color:#94a3b8; margin-bottom:12px;">ऑपरेटर पोर्टल द्वारा अपडेट किया गया शिकायतों का लाइव स्टेटस:</p>
    <div id="complaintsList">
        <p style="font-size:0.85rem; color:#64748b;">शिकायतों का डेटा लोड हो रहा है...</p>
    </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyCVsmFa6Xr-_EfUqh_ZS6tmzBwcdMZq0JA",
    authDomain: "universal-portal-dashboard.firebaseapp.com",
    projectId: "universal-portal-dashboard",
    storageBucket: "universal-portal-dashboard.firebasestorage.app",
    messagingSenderId: "403036962443",
    appId: "1:403036962443:web:5a15ac684c76efd2c3de8e"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

const workerId = localStorage.getItem("loggedWorkerId");
if (!workerId) {
    alert("कृपया पहले लॉगिन करें!");
    window.location.href = "worker-signup.html";
}

let isEditing = false;
const todayStr = new Date().toISOString().split('T')[0];

window.onload = function() {
    loadProfileData();
    checkAttendanceStatus();
    loadComplaintsStatus();
};

// 1. Profile Data Loader
function loadProfileData() {
    firebase.firestore().collection("workers").doc(workerId).get().then((doc) => {
        if (!doc.exists) return;
        const w = doc.data();

        document.getElementById('displayName').innerText = w.name || "Worker Name";
        document.getElementById('displayRole').innerText = `${w.role || 'Field Technician'} | ID: ${workerId.slice(0,6)}`;
        if (w.photoUrl) {
            document.getElementById('displayDp').src = w.photoUrl;
            document.getElementById('photoUrl').value = w.photoUrl;
        }

        document.getElementById('workerName').value = w.name || '';
        document.getElementById('workerPhone').value = w.phone || '';
        document.getElementById('fatherName').value = w.fatherName || '';
        document.getElementById('motherName').value = w.motherName || '';
        document.getElementById('dob').value = w.dob || '';
        document.getElementById('maritalStatus').value = w.maritalStatus || 'Unmarried';
        document.getElementById('previousWork').value = w.previousWork || '';
        document.getElementById('experience').value = w.experience || '';
        document.getElementById('skills').value = w.skills || '';
    }).catch(err => console.error("Profile load error:", err));
}

// 2. Toggle Edit Mode
function toggleEditMode() {
    isEditing = !isEditing;
    const inputs = ['photoUrl', 'workerName', 'workerPhone', 'fatherName', 'motherName', 'dob', 'maritalStatus', 'previousWork', 'experience', 'skills'];
    
    inputs.forEach(id => {
        document.getElementById(id).disabled = !isEditing;
    });

    const editBtn = document.getElementById('editToggleBtn');
    const saveBtn = document.getElementById('saveProfileBtn');

    if (isEditing) {
        editBtn.className = "btn btn-danger";
        editBtn.innerHTML = '<i class="fa-solid fa-xmark"></i> रद्द करें (Cancel)';
        saveBtn.style.display = 'flex';
    } else {
        editBtn.className = "btn btn-warning";
        editBtn.innerHTML = '<i class="fa-solid fa-pen-to-square"></i> एडिट करें (Edit)';
        saveBtn.style.display = 'none';
        loadProfileData(); // Restores original
    }
}

// 3. Save Profile Data (Reflects in Operator Portal)
function saveProfileData() {
    const updateObj = {
        photoUrl: document.getElementById('photoUrl').value.trim(),
        name: document.getElementById('workerName').value.trim(),
        phone: document.getElementById('workerPhone').value.trim(),
        fatherName: document.getElementById('fatherName').value.trim(),
        motherName: document.getElementById('motherName').value.trim(),
        dob: document.getElementById('dob').value,
        maritalStatus: document.getElementById('maritalStatus').value,
        previousWork: document.getElementById('previousWork').value.trim(),
        experience: document.getElementById('experience').value.trim(),
        skills: document.getElementById('skills').value.trim(),
        status: "Profile Updated"
    };

    firebase.firestore().collection("workers").doc(workerId).set(updateObj, { merge: true })
        .then(() => {
            alert("आपकी प्रोफाइल सफलतापूर्वक सेव हो गई है! अब यह यूनिवर्सल ऑपरेटर पोर्टल पर भी अपडेट हो गई है।");
            toggleEditMode();
            loadProfileData();
        })
        .catch(err => alert("Error saving profile: " + err.message));
}

// 4. Attendance Handling
function checkAttendanceStatus() {
    firebase.firestore().collection("workers").doc(workerId).collection("attendance").doc(todayStr).get().then((doc) => {
        if(doc.exists) {
            const att = doc.data();
            if(att.punchOut) {
                document.getElementById('attStatusText').innerText = `आज का कार्य पूरा हुआ! IN (${att.punchIn}) | OUT (${att.punchOut})`;
                document.getElementById('btnIn').disabled = true;
                document.getElementById('btnOut').disabled = true;
            } else if(att.punchIn) {
                document.getElementById('attStatusText').innerText = `आप ऑनलाइन हैं! आगमन समय: ${att.punchIn}`;
                document.getElementById('btnIn').disabled = true;
                document.getElementById('btnOut').disabled = false;
            }
        } else {
            document.getElementById('attStatusText').innerText = "आज की हाजिरी दर्ज करने के लिए Push IN पर क्लिक करें:";
        }
    });
}

function punchIn() {
    const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    firebase.firestore().collection("workers").doc(workerId).collection("attendance").doc(todayStr).set({
        punchIn: timeNow,
        date: todayStr,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true }).then(() => {
        alert("Push IN सफलता से दर्ज हुआ!");
        checkAttendanceStatus();
    });
}

function punchOut() {
    const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    firebase.firestore().collection("workers").doc(workerId).collection("attendance").doc(todayStr).set({
        punchOut: timeNow
    }, { merge: true }).then(() => {
        alert("Push OUT सफलता से दर्ज हुआ!");
        checkAttendanceStatus();
    });
}

// 5. Complaints Live Tracking Status (From Operator Portal)
function loadComplaintsStatus() {
    firebase.firestore().collection("complaints")
        .where("assignedWorkerId", "==", workerId)
        .onSnapshot((snapshot) => {
            const listDiv = document.getElementById('complaintsList');
            if(snapshot.empty) {
                listDiv.innerHTML = '<p style="font-size:0.85rem; color:#64748b;">कोई सक्रिय शिकायत दर्ज नहीं है।</p>';
                return;
            }

            let html = '';
            snapshot.forEach(doc => {
                const c = doc.data();
                const isDone = c.status === "Done" || c.status === "Resolved";
                
                html += `
                    <div class="complaint-item">
                        <div>
                            <strong style="font-size:0.9rem; color:#fff;">${c.customerName || 'Customer'} (${c.address || 'Location'})</strong>
                            <p style="font-size:0.78rem; color:#94a3b8;">समस्या: ${c.issue || 'No details'}</p>
                        </div>
                        <div>
                            ${isDone ? '<span class="badge-done"><i class="fa-solid fa-check-double"></i> Done (निपटारा हो गया)</span>' 
                                     : '<span class="badge-pending"><i class="fa-solid fa-spinner fa-spin"></i> Pending (प्रगति पर)</span>'}
                        </div>
                    </div>
                `;
            });
            listDiv.innerHTML = html;
        }, err => console.error("Complaints load error:", err));
}

// 6. Logout Function
function logout() {
    localStorage.removeItem("loggedWorkerId");
    window.location.href = "worker-signup.html";
}
</script>
</body>
          </html>
