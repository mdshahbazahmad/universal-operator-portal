<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worker Dashboard</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>:root{--primary:#38bdf8;--bg:#0f172a;--card:#1e293b;--border:#ffffff20}*{box-sizing:border-box}body{margin:auto;padding:16px;max-width:850px;background:var(--bg);color:#f8fafc;font:15px system-ui,sans-serif}.header,.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px}.header{display:flex;align-items:center;justify-content:space-between}.user{display:flex;align-items:center;gap:12px}.avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;border:2px solid var(--primary)}h1,h2{margin:0;color:var(--primary);font-size:1.15rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.field label{display:block;color:#94a3b8;font-size:.83rem;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;background:#0f172a;color:white;border:1px solid var(--border);border-radius:8px}.btn{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:700;color:#082f49;background:var(--primary);margin:5px 5px 0 0}.btn:disabled{opacity:.5}.danger{background:#ef4444;color:white}.done{color:#86efac}.pending{color:#fcd34d}.ticket{border:1px solid var(--border);padding:13px;border-radius:10px;margin-top:10px}.error{color:#fecaca;white-space:pre-wrap}.powered{text-align:center;color:#94a3b8;font-size:.75rem}</style></head><body><header class="header"><div class="user"><img id="avatar" class="avatar" src="https://via.placeholder.com/60" alt="Profile photo"><div><h1 id="workerName">Loading…</h1><small id="workerRole"></small></div></div><button class="btn danger" onclick="logout()">Logout</button></header><section class="card"><h2>Daily attendance</h2><p id="attendanceStatus">Loading today’s attendance…</p><button id="punchInButton" class="btn" onclick="punchIn()">Push IN</button><button id="punchOutButton" class="btn danger" onclick="punchOut()" disabled>Push OUT</button></section><section class="card"><h2>Worker profile</h2><form onsubmit="saveProfile(event)"><div class="field"><label>Profile photo (image ≤ 300 KB)</label><input type="file" id="photo" accept="image/*"></div><div class="grid"><div class="field"><label>Full name *</label><input id="name" maxlength="100" required></div><div class="field"><label>Phone *</label><input id="phone" type="tel" maxlength="20" required></div><div class="field"><label>Gender</label><select id="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div><div class="field"><label>Qualification *</label><input id="qualification" maxlength="100" required></div><div class="field"><label>Father’s name</label><input id="fatherName" maxlength="100"></div><div class="field"><label>Mother’s name</label><input id="motherName" maxlength="100"></div><div class="field"><label>Date of birth</label><input id="dob" type="date"></div><div class="field"><label>Marital status</label><select id="maritalStatus"><option>Unspecified</option><option>Unmarried</option><option>Married</option></select></div><div class="field"><label>Previous work</label><input id="previousWork" maxlength="120"></div><div class="field"><label>Experience *</label><input id="experience" maxlength="100" required></div><div class="field"><label>Skills *</label><input id="skills" maxlength="300" required></div><div class="field"><label>Permanent address *</label><textarea id="address" rows="2" maxlength="500" required></textarea></div><div class="field"><label>Aadhaar (private; not visible to operator)</label><input id="aadhaar" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="Optional"></div></div><button id="saveButton" class="btn" type="submit">Save profile</button><span id="profileMessage" class="error" role="status"></span></form></section><section class="card"><h2>Assigned complaints</h2><div id="complaints">Loading…</div></section><p class="powered">Powered by Eagle Network</p><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script><script>
const cfg={apiKey:'AIzaSyCVsmFa6Xr-_EfUqh_ZS6tmzBwcdMZq0JA',authDomain:'universal-portal-dashboard.firebaseapp.com',projectId:'universal-portal-dashboard',storageBucket:'universal-portal-dashboard.firebasestorage.app',messagingSenderId:'403036962443',appId:'1:403036962443:web:5a15ac684c76efd2c3de8e'};if(!firebase.apps.length)firebase.initializeApp(cfg);const db=firebase.firestore();let uid=null,workerDocId=null,profileUnsub=null,complaintUnsub=null;const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));firebase.auth().onAuthStateChanged(async user=>{if(!user){location.replace('worker-signup.html');return}uid=user.uid;try{let snap=await db.collection('workers').doc(uid).get();if(snap.exists)workerDocId=uid;else{const q=await db.collection('workers').where('uid','==',uid).limit(2).get();if(q.size===1){snap=q.docs[0];workerDocId=snap.id}else if(q.size>1)throw Error('More than one worker record has this UID. Contact your operator to reconcile the records.');else if(user.email&&user.emailVerified){for(const email of [...new Set([user.email,user.email.toLowerCase(),user.email.toUpperCase()])]){const result=await db.collection('workers').where('email','==',email).limit(2).get();if(result.size===1){snap=result.docs[0];workerDocId=snap.id;await snap.ref.update({uid:user.uid,email:user.email,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});break}if(result.size>1)throw Error('Multiple legacy profiles match this email. Contact your operator.')}}}if(!workerDocId)throw Error(user.email&&!user.emailVerified?'Your legacy worker profile can only be linked after verifying this email. Use the verification link or ask the operator to resend an invite.':'No worker profile is linked to this Firebase UID. Use the operator invite or contact the operator; no blank profile was created.');profileUnsub=db.collection('workers').doc(workerDocId).onSnapshot(doc=>{if(!doc.exists){showError('Worker record no longer exists.');return}const w=doc.data();document.getElementById('workerName').textContent=w.name||'Worker';document.getElementById('workerRole').textContent=`${w.role||'Field Technician'} · ${w.status||'Profile incomplete'}`;if(w.photoUrl)document.getElementById('avatar').src=w.photoUrl;for(const [id,key] of Object.entries({name:'name',phone:'phone',gender:'gender',qualification:'qualification',fatherName:'fatherName',motherName:'motherName',dob:'dob',maritalStatus:'maritalStatus',previousWork:'previousWork',experience:'experience',skills:'skills',address:'address'}))document.getElementById(id).value=w[key]||''});db.collection('workers').doc(workerDocId).collection('private').doc('identity').get().then(doc=>{if(doc.exists)document.getElementById('aadhaar').value=doc.data().aadhaarNumber||''}).catch(showError);watchAttendance();complaintUnsub=db.collection('complaints').where('assignedWorkerId','==',uid).onSnapshot(renderComplaints,showError)}catch(err){showError(err.message)}});function showError(e){document.getElementById('profileMessage').textContent=e.message||String(e)}async function saveProfile(e){e.preventDefault();const button=document.getElementById('saveButton'),message=document.getElementById('profileMessage');button.disabled=true;message.textContent='Saving…';try{let photoUrl=document.getElementById('avatar').src;const file=document.getElementById('photo').files[0];if(file){if(!file.type.startsWith('image/')||file.size>300*1024)throw Error('Image must be 300 KB or smaller.');photoUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('Image could not be read.'));reader.readAsDataURL(file)})}const fields=['name','phone','gender','qualification','fatherName','motherName','dob','maritalStatus','previousWork','experience','skills','address'],profile={photoUrl,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};fields.forEach(id=>profile[id]=document.getElementById(id).value.trim());profile.status=profile.name&&profile.phone&&profile.qualification&&profile.experience&&profile.skills&&profile.address?'Active':'Pending Profile Fill';await db.collection('workers').doc(workerDocId).set(profile,{merge:true});const aadhaar=document.getElementById('aadhaar').value.replace(/\D/g,'');if(aadhaar&&aadhaar.length!==12)throw Error('Aadhaar must have 12 digits.');await db.collection('workers').doc(workerDocId).collection('private').doc('identity').set({aadhaarNumber:aadhaar,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});message.textContent=profile.status==='Active'?'Profile saved — registration complete.':'Profile saved; complete required fields to activate.'}catch(err){message.textContent=err.message}finally{button.disabled=false}}function watchAttendance(){db.collection('workers').doc(workerDocId).collection('attendance').doc(today()).onSnapshot(doc=>{const a=doc.exists?doc.data():{},inBtn=document.getElementById('punchInButton'),outBtn=document.getElementById('punchOutButton');inBtn.disabled=!!a.punchIn;outBtn.disabled=!a.punchIn||!!a.punchOut;document.getElementById('attendanceStatus').textContent=a.punchOut?`Complete · IN ${a.punchIn} / OUT ${a.punchOut}`:a.punchIn?`On shift · IN ${a.punchIn}`:'No attendance recorded today.'},showError)}async function punchIn(){try{await db.collection('workers').doc(workerDocId).collection('attendance').doc(today()).set({date:today(),punchIn:new Date().toISOString(),timestamp:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})}catch(e){showError(e)}}async function punchOut(){try{const ref=db.collection('workers').doc(workerDocId).collection('attendance').doc(today());await db.runTransaction(async tx=>{const s=await tx.get(ref);if(!s.exists||!s.data().punchIn||s.data().punchOut)throw Error('Push IN is required and Push OUT can only be recorded once.');tx.update(ref,{punchOut:new Date().toISOString(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()})})}catch(e){showError(e)}}function renderComplaints(snapshot){const root=document.getElementById('complaints');root.innerHTML='';if(snapshot.empty){root.textContent='No complaints are assigned to you.';return}snapshot.forEach(doc=>{const c=doc.data(),done=['Done','Solved','Resolved','Completed'].includes(c.status),phone=c.customerPhone||c.phone||'',coords=Number(c.lat)&&Number(c.lng)?`https://maps.google.com/?q=${encodeURIComponent(c.lat)},${encodeURIComponent(c.lng)}`:'';const item=document.createElement('article');item.className='ticket';item.innerHTML=`<strong>${esc(c.ticketNo||doc.id)}</strong> · <span class="${done?'done':'pending'}">${done?'Solved':'Pending'}</span><p>${esc(c.customerName||c.name||'Customer')} · ${esc(phone)}</p><p>${esc(c.address||'')}<br>${esc(c.issue||c.desc||'')}</p>${phone?`<a href="tel:${encodeURIComponent(phone)}">Call customer</a> `:''}${coords?`<a target="_blank" rel="noopener" href="${coords}">Open map</a>`:''}${done?'':` <button class="btn">Mark done</button>`}`;const button=item.querySelector('button');if(button)button.onclick=()=>completeComplaint(doc.id);root.appendChild(item)})}async function completeComplaint(id){const action=prompt('Work completed (optional):','Resolved');if(action===null)return;try{await db.collection('complaints').doc(id).update({status:'Done',actionTaken:action,resolvedAt:firebase.firestore.FieldValue.serverTimestamp()})}catch(e){showError(e)}}async function logout(){if(profileUnsub)profileUnsub();if(complaintUnsub)complaintUnsub();await firebase.auth().signOut();location.replace('worker-signup.html')}
</script></body></html>
