<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Sub-Dashboard - Field Operations</title>

    <!-- FontAwesome & Google Fonts -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #38bdf8;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-dark: #070a12;
            --card-bg: rgba(15, 23, 42, 0.85);
            --border-color: rgba(255, 255, 255, 0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-dark); color: #f8fafc; padding: 15px; }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 12px 18px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .worker-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .worker-profile img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            object-fit: cover;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .complaint-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            border-left: 4px solid var(--warning);
        }

        .complaint-card.done {
            border-left-color: var(--success);
            opacity: 0.7;
        }

        .btn-action {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.82rem;
            cursor: pointer;
            margin-top: 10px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-call {
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: #fff;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.82rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-right: 8px;
        }
    </style>
</head>
<body>

    <header>
        <div class="worker-profile">
            <img id="wPhoto" src="https://i.ibb.co/cKBTN905/IMG-20260821-WA0005.jpg" alt="Worker">
            <div>
                <h3 id="wName" style="font-size:0.95rem;">Loading Worker...</h3>
                <small id="wRole" style="color:#94a3b8;">Field Technician</small>
            </div>
        </div>
        <button onclick="logoutWorker()" style="background:none; border:none; color:var(--danger); font-weight:800; cursor:pointer;">
            <i class="fa-solid fa-power-off"></i> एग्जिट
        </button>
    </header>

    <div class="card">
        <div class="card-title">
            <i class="fa-solid fa-headset"></i> आपकी असाइन की गई फ़ील्ड शिकायतें (Assigned Complaints)
        </div>
        <div id="complaintsContainer">
            <!-- Complaints will be loaded dynamically -->
            <p style="color:#94a3b8; font-size:0.88rem;">शिकायतें लोड हो रही हैं...</p>
        </div>
    </div>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCVsmFa6Xr-_EfUqh_ZS6tmzBwcdMZq0JA",
            authDomain: "universal-portal-dashboard.firebaseapp.com",
            projectId: "universal-portal-dashboard",
            storageBucket: "universal-portal-dashboard.firebasestorage.app",
            messagingSenderId: "403036962443",
            appId: "1:403036962443:web:5a15ac684c76efd2c3de8e"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const urlParams = new URLSearchParams(window.location.search);
        const workerId = urlParams.get('workerId');

        function loadWorkerDetails() {
            if(!workerId) {
                alert("अवैध वर्कर सत्र!");
                return;
            }

            firebase.firestore().collection("workers").doc(workerId).get().then((doc) => {
                if(doc.exists) {
                    const data = doc.data();
                    document.getElementById('wName').innerText = data.name;
                    document.getElementById('wRole').innerText = data.role + " | " + (data.phone || '');
                    if(data.photoUrl) document.getElementById('wPhoto').src = data.photoUrl;
                }
            });
        }

        function loadAssignedComplaints() {
            const container = document.getElementById('complaintsContainer');

            firebase.firestore().collection("complaints").onSnapshot((snapshot) => {
                container.innerHTML = '';
                if(snapshot.empty) {
                    container.innerHTML = '<p style="color:#94a3b8; font-size:0.88rem;">कोई लंबित शिकायत नहीं है।</p>';
                    return;
                }

                snapshot.forEach((doc) => {
                    const c = doc.data();
                    const id = doc.id;
                    const isDone = c.status === "Resolved" || c.status === "Done";

                    container.innerHTML += `
                        <div class="complaint-card ${isDone ? 'done' : ''}">
                            <strong style="display:block; font-size:0.95rem; color:#fff;">${c.customerName || 'कस्टमर'}</strong>
                            <p style="font-size:0.85rem; color:#cbd5e1; margin:4px 0;"><i class="fa-solid fa-location-dot" style="color:var(--primary);"></i> ${c.address || 'पता दर्ज नहीं'}</p>
                            <p style="font-size:0.85rem; color:#fbbf24; margin-bottom:8px;"><strong>समस्या:</strong> ${c.issue || 'नेटवर्क / फ़ाइबर समस्या'}</p>
                            
                            <a href="tel:${c.phone}" class="btn-call"><i class="fa-solid fa-phone"></i> कॉल करें</a>
                            ${!isDone ? `
                                <button class="btn-action" onclick="markComplaintDone('${id}')">
                                    <i class="fa-solid fa-circle-check"></i> काम पूरा हुआ (Done)
                                </button>
                            ` : `<span style="color:var(--success); font-weight:800; font-size:0.85rem;"><i class="fa-solid fa-check-double"></i> समाधान हो गया</span>`}
                        </div>
                    `;
                });
            });
        }

        function markComplaintDone(complaintId) {
            if(confirm("क्या यह शिकायत पूरी तरह हल हो गई है?")) {
                firebase.firestore().collection("complaints").doc(complaintId).update({
                    status: "Resolved",
                    resolvedByWorkerId: workerId,
                    resolvedAt: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    alert("मुख्य पोर्टल पर स्टेटस UPDATE हो गया है!");
                });
            }
        }

        function logoutWorker() {
            window.location.href = "index.html";
        }

        window.onload = function() {
            loadWorkerDetails();
            loadAssignedComplaints();
        };
    </script>
</body>
</html>
