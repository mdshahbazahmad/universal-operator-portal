<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EAGLE NETWORK SBZ - Universal Portal</title>
  
  <!-- FontAwesome & QR Library -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- FIREBASE SDK (v8/v9 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <style>
    :root {
      --bg-body: #0b0f19;
      --bg-card: #151c2c;
      --bg-sidebar: #111827;
      --border-color: rgba(255,255,255,0.08);
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-body); color: var(--text-main); height: 100vh; overflow: hidden; }

    /* LOGIN SCREEN */
    #authContainer {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: var(--bg-body);
      display: flex; justify-content: center; align-items: center;
      z-index: 99999;
    }
    
    .auth-box {
      background: var(--bg-card);
      padding: 30px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      width: 90%; max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 5px; }
    
    .password-wrapper { position: relative; display: flex; align-items: center; }
    .form-control { width: 100%; padding: 10px 12px; background: var(--bg-body); border: 1px solid var(--border-color); color: #fff; border-radius: 6px; outline: none; }
    .eye-btn { position: absolute; right: 10px; background: none; border: none; color: var(--text-muted); cursor: pointer; }

    .btn-primary { background: var(--primary); color: #000; border: none; padding: 10px; border-radius: 6px; font-weight: bold; width: 100%; cursor: pointer; font-size: 1rem; }
    .btn-primary:hover { background: var(--primary-hover); color: #fff; }

    .forgot-link { display: block; text-align: right; font-size: 0.8rem; color: var(--primary); margin-top: 8px; text-decoration: none; cursor: pointer; }

    /* DASHBOARD */
    #appWrapper { display: none; width: 100%; height: 100%; }

    .sidebar { width: 250px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
    .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px; color: var(--primary); }
    .sidebar-menu { list-style: none; padding: 20px 0; flex-grow: 1; }
    .sidebar-menu li a { display: flex; align-items: center; gap: 12px; padding: 12px 20px; color: var(--text-muted); text-decoration: none; }
    .sidebar-menu li.active a { background-color: rgba(56, 189, 248, 0.1); color: var(--primary); border-left: 4px solid var(--primary); }

    .main-content { flex-grow: 1; overflow-y: auto; padding: 25px; }
    .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .tab-section { display: none; }
    .tab-section.active { display: block; }

    .dashboard-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 25px; }
    .card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px; padding: 20px; }
    .card-title { font-size: 0.9rem; color: var(--text-muted); }
    .card-value { font-size: 1.8rem; font-weight: bold; margin-top: 5px; }

    .table-container { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px; overflow-x: auto; margin-top: 20px; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 14px 18px; border-bottom: 1px solid var(--border-color); }
    th { background-color: rgba(255,255,255,0.02); color: var(--text-muted); }

    #qrcode { display: flex; justify-content: center; background: white; padding: 15px; border-radius: 8px; margin-top: 15px; }
  </style>
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="authContainer">
    <div class="auth-box">
      <h2 style="color: var(--primary); text-align: center; margin-bottom: 15px;">
        <i class="fa-solid fa-wifi"></i> EAGLE SBZ
      </h2>
      
      <form onsubmit="handleAuth(event)">
        <div class="form-group">
          <label>Email ID</label>
          <input type="email" id="auth-email" class="form-control" placeholder="admin@eaglenetwork.com" required>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="password-wrapper">
            <input type="password" id="auth-password" class="form-control" placeholder="••••••••" required>
            <button type="button" class="eye-btn" onclick="togglePassword('auth-password', this)">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
          <span class="forgot-link" onclick="handleForgotPassword()">Forget Password?</span>
        </div>

        <button type="submit" class="btn-primary" style="margin-top: 10px;">लॉगिन / साइन-अप करें</button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="appWrapper">
    <div class="sidebar">
      <div class="sidebar-header">
        <i class="fa-solid fa-wifi fa-xl"></i>
        <h3>EAGLE SBZ</h3>
      </div>
      <ul class="sidebar-menu">
        <li class="active" onclick="switchTab('sec-dashboard')">
          <a href="#"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
        </li>
        <li onclick="switchTab('sec-subscribers')">
          <a href="#"><i class="fa-solid fa-users"></i> Subscribers</a>
        </li>
        <li onclick="switchTab('sec-payment')">
          <a href="#"><i class="fa-solid fa-qrcode"></i> UPI Payment QR</a>
        </li>
        <li onclick="switchTab('sec-settings')">
          <a href="#"><i class="fa-solid fa-gear"></i> Settings</a>
        </li>
      </ul>
      <div style="padding: 20px;">
        <button onclick="handleLogout()" class="btn-primary" style="background: var(--danger); color: white;">
          <i class="fa-solid fa-power-off"></i> Logout
        </button>
      </div>
    </div>

    <div class="main-content">
      
      <div id="sec-dashboard" class="tab-section active">
        <div class="top-header">
          <h2>Dashboard Overview</h2>
          <span style="color: var(--text-muted);" id="user-display">Logged In</span>
        </div>

        <div class="dashboard-cards">
          <div class="card">
            <div class="card-title">Total Subscribers</div>
            <div class="card-value" id="total-subs">0</div>
          </div>
          <div class="card">
            <div class="card-title">Active Connections</div>
            <div class="card-value" style="color: var(--success);" id="active-subs">0</div>
          </div>
          <div class="card">
            <div class="card-title">Pending Payments</div>
            <div class="card-value" style="color: var(--danger);" id="pending-subs">0</div>
          </div>
        </div>
      </div>

      <div id="sec-subscribers" class="tab-section">
        <div class="top-header"><h2>Subscribers List</h2></div>
        <div class="table-container">
          <table>
            <thead>
              <tr><th>ID</th><th>Name</th><th>Plan</th><th>Status</th></tr>
            </thead>
            <tbody id="subscriber-table-body"></tbody>
          </table>
        </div>
      </div>

      <div id="sec-payment" class="tab-section">
        <div class="top-header"><h2>UPI Payment Generator</h2></div>
        <div class="card" style="max-width: 450px; margin: 0 auto; text-align: center;">
          <div class="form-group">
            <label>Amount (₹)</label>
            <input type="number" id="qr-amount" class="form-control" value="500">
          </div>
          <button class="btn-primary" onclick="generateUPIQR()">QR Generate करें</button>
          <div id="qrcode"></div>
          <p id="upi-id-display" style="margin-top: 15px; font-weight: bold; color: var(--primary);"></p>
        </div>
      </div>

      <div id="sec-settings" class="tab-section">
        <div class="top-header"><h2>Portal Settings</h2></div>
        <div class="card" style="max-width: 450px;">
          <div class="form-group">
            <label>Your UPI ID</label>
            <input type="text" id="setting-upi-1" class="form-control">
          </div>
          <div class="form-group">
            <label>Business Name</label>
            <input type="text" id="setting-merchant-name" class="form-control">
          </div>
          <button class="btn-primary" onclick="saveSettings()">Save Settings</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    // आपकी असली FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyCVsmFa6Xr-_EfUqh_ZS6tmzBwcdMZq0JA",
      authDomain: "universal-portal-dashboard.firebaseapp.com",
      projectId: "universal-portal-dashboard",
      storageBucket: "universal-portal-dashboard.firebasestorage.app",
      messagingSenderId: "403036962443",
      appId: "1:403036962443:web:52b233377303ecb1c3de8e"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('i');
      if (input.type === "password") {
        input.type = "text";
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = "password";
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    auth.onAuthStateChanged((user) => {
      if (user) {
        document.getElementById('authContainer').style.display = 'none';
        document.getElementById('appWrapper').style.display = 'flex';
        document.getElementById('user-display').innerText = user.email;
        renderSubscribers();
        loadSettings();
      } else {
        document.getElementById('authContainer').style.display = 'flex';
        document.getElementById('appWrapper').style.display = 'none';
      }
    });

    function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value;
      const pass = document.getElementById('auth-password').value;

      auth.signInWithEmailAndPassword(email, pass).catch((err) => {
        if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') {
          auth.createUserWithEmailAndPassword(email, pass).catch(e => alert("Error: " + e.message));
        } else {
          alert("Error: " + err.message);
        }
      });
    }

    function handleForgotPassword() {
      const email = document.getElementById('auth-email').value;
      if (!email) {
        alert("कृपया अपना Email ID दर्ज करें!");
        return;
      }
      auth.sendPasswordResetEmail(email)
        .then(() => alert("पासवर्ड रीसेट लिंक आपके ईमेल पर भेज दिया गया है।"))
        .catch(err => alert("Error: " + err.message));
    }

    function handleLogout() {
      auth.signOut();
    }

    let subscribers = JSON.parse(localStorage.getItem('sbz_subscribers')) || [
      { id: "SUB-101", name: "Rahul Kumar", plan: "50 Mbps Base", status: "Active" }
    ];

    let settings = JSON.parse(localStorage.getItem('sbz_settings')) || {
      upi1: "eaglenetwork@upi",
      merchantName: "Eagle Network SBZ"
    };

    function renderSubscribers() {
      const tbody = document.getElementById('subscriber-table-body');
      tbody.innerHTML = '';
      let active = 0, pending = 0;

      subscribers.forEach((sub) => {
        if (sub.status === 'Active') active++; else pending++;
        tbody.innerHTML += `<tr><td>${sub.id}</td><td>${sub.name}</td><td>${sub.plan}</td><td><span style="color:${sub.status==='Active'?'var(--success)':'var(--danger)'}">${sub.status}</span></td></tr>`;
      });

      document.getElementById('total-subs').innerText = subscribers.length;
      document.getElementById('active-subs').innerText = active;
      document.getElementById('pending-subs').innerText = pending;
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-section').forEach(sec => sec.classList.remove('active'));
      document.querySelectorAll('.sidebar-menu li').forEach(li => li.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      if (tabId === 'sec-payment') generateUPIQR();
    }

    function generateUPIQR() {
      const amount = document.getElementById('qr-amount').value || "0";
      const upiString = `upi://pay?pa=${settings.upi1}&pn=${encodeURIComponent(settings.merchantName)}&am=${amount}&cu=INR`;
      const container = document.getElementById('qrcode');
      container.innerHTML = '';
      new QRCode(container, { text: upiString, width: 150, height: 150 });
      document.getElementById('upi-id-display').innerText = `UPI: ${settings.upi1}`;
    }

    function loadSettings() {
      document.getElementById('setting-upi-1').value = settings.upi1;
      document.getElementById('setting-merchant-name').value = settings.merchantName;
    }

    function saveSettings() {
      settings.upi1 = document.getElementById('setting-upi-1').value;
      settings.merchantName = document.getElementById('setting-merchant-name').value;
      localStorage.setItem('sbz_settings', JSON.stringify(settings));
      alert("Settings Saved!");
    }
  </script>
</body>
  </html>
