<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worker Login / Signup</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>
:root{--primary:#38bdf8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#0f172a;color:#f8fafc;font:15px system-ui,sans-serif}.card{width:min(100%,520px);padding:25px;border:1px solid #ffffff20;border-radius:16px;background:#1e293b}h1{font-size:1.35rem;color:var(--primary)}.field{margin:13px 0}.field label{display:block;color:#cbd5e1;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;background:#0f172a;color:white;border:1px solid #ffffff30;border-radius:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.row{display:flex;gap:8px}.row button,button.submit{border:0;padding:11px;border-radius:8px;cursor:pointer;font-weight:700}.row button{flex:1;background:#334155;color:white}.row button.active,button.submit{background:var(--primary);color:#082f49}.submit{width:100%;margin-top:8px}.hint{font-size:.8rem;color:#94a3b8}.error{color:#fecaca;white-space:pre-wrap}.powered{text-align:center;color:#94a3b8;font-size:.76rem;margin-top:14px}@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="card"><h1>Worker Portal</h1><p class="hint">Your account and worker record are linked by Firebase UID. Sign in on any device to load your saved profile.</p><div class="row"><button id="signupTab" class="active" type="button" onclick="setMode('signup')">Sign up / Accept invite</button><button id="loginTab" type="button" onclick="setMode('login')">Login</button></div><form onsubmit="authWorker(event)"><div class="grid"><div class="field" id="nameField"><label for="name">Full name *</label><input id="name" maxlength="100" autocomplete="name"></div><div class="field" id="phoneField"><label for="phone">Phone *</label><input id="phone" type="tel" maxlength="20" autocomplete="tel"></div><div class="field" id="genderField"><label for="gender">Gender</label><select id="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div><div class="field" id="qualificationField"><label for="qualification">Qualification</label><input id="qualification" maxlength="100"></div><div class="field" id="experienceField"><label for="experience">Experience</label><input id="experience" maxlength="100" placeholder="e.g. 2 years"></div><div class="field" id="skillsField"><label for="skills">Skills</label><input id="skills" maxlength="300" placeholder="Fiber, networking…"></div><div class="field" id="addressField" style="grid-column:1/-1"><label for="address">Permanent address</label><textarea id="address" rows="2" maxlength="500"></textarea></div></div><div class="field"><label for="email">Email</label><input id="email" type="email" required maxlength="254" autocomplete="email"></div><div class="field"><label for="password">Password</label><input id="password" type="password" required minlength="6" autocomplete="new-password"></div><button id="submit" class="submit">Create account</button></form><p id="error" class="error" role="alert"></p><p class="powered">Powered by Eagle Network</p></main>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script><script>
const cfg={apiKey:'AIzaSyCVsmFa6Xr-_EfUqh_ZS6tmzBwcdMZq0JA',authDomain:'universal-portal-dashboard.firebaseapp.com',projectId:'universal-portal-dashboard',storageBucket:'universal-portal-dashboard.firebasestorage.app',messagingSenderId:'403036962443',appId:'1:403036962443:web:5a15ac684c76efd2c3de8e'};if(!firebase.apps.length)firebase.initializeApp(cfg);const params=new URLSearchParams(location.search);const inviteId=params.get('workerId');const inviteToken=params.get('token');let mode=inviteId?'signup':'signup';if(inviteId){document.getElementById('name').value=params.get('name')||'';document.getElementById('phone').value=params.get('phone')||''}function setMode(m){mode=m;document.getElementById('nameField').hidden=m==='login';document.getElementById('phoneField').hidden=m==='login';for(const id of ['genderField','qualificationField','experienceField','skillsField','addressField'])document.getElementById(id).hidden=m==='login';document.getElementById('signupTab').classList.toggle('active',m==='signup');document.getElementById('loginTab').classList.toggle('active',m==='login');document.getElementById('submit').textContent=m==='signup'?'Create account / accept invite':'Login';document.getElementById('password').autocomplete=m==='login'?'current-password':'new-password'}async function authWorker(e){e.preventDefault();const button=document.getElementById('submit'),error=document.getElementById('error');error.textContent='';button.disabled=true;try{const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value,db=firebase.firestore();let user;if(mode==='login'){user=(await firebase.auth().signInWithEmailAndPassword(email,password)).user;let worker=await db.collection('workers').doc(user.uid).get();if(!worker.exists&&user.email){const match=await db.collection('workers').where('email','==',user.email).limit(1).get();if(!match.empty){const legacy=match.docs[0];if(legacy.id!==user.uid){await legacy.ref.update({uid:user.uid,email:user.email,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});}worker=await db.collection('workers').doc(legacy.id).get()}}if(!worker.exists)throw new Error('No worker profile is linked to this account. Open your operator’s invitation link or contact the operator.');}else{const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim();if(!name||!phone)throw new Error('Full name and phone are required.');const profile={uid:'',name,phone,email,gender:document.getElementById('gender').value,qualification:document.getElementById('qualification').value.trim(),experience:document.getElementById('experience').value.trim(),skills:document.getElementById('skills').value.trim(),address:document.getElementById('address').value.trim(),status:'Pending Profile Fill',updatedAt:firebase.firestore.FieldValue.serverTimestamp()};user=(await firebase.auth().createUserWithEmailAndPassword(email,password)).user;profile.uid=user.uid;const status=profile.skills&&profile.qualification&&profile.address?'Active':'Pending Profile Fill';profile.status=status;if(inviteId){if(!inviteToken)throw new Error('This invite link is incomplete. Ask the operator to resend it.');await db.collection('workers').doc(inviteId).update({...profile,inviteToken,registeredAt:firebase.firestore.FieldValue.serverTimestamp()})}else{profile.createdAt=firebase.firestore.FieldValue.serverTimestamp();await db.collection('workers').doc(user.uid).set(profile,{merge:true})}}location.href='worker-dashboard.html'}catch(err){error.textContent=err.message||'Unable to complete sign-in.';button.disabled=false}}firebase.auth().onAuthStateChanged(user=>{if(user&&!location.pathname.endsWith('worker-dashboard.html')){/* Keep this page available for account switching. */}});
</script></body></html>
