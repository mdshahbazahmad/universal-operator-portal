<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worker Portal - Login & Sign Up</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --primary: #38bdf8; --bg-dark: #0f172a; --card-bg: rgba(30, 41, 59, 0.85); --border-color: rgba(255, 255, 255, 0.12); }
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
body { background: var(--bg-dark); color: #f8fafc; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.auth-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 25px; width: 100%; max-width: 440px; backdrop-filter: blur(10px); }
.auth-card h2 { color: var(--primary); font-size: 1.3rem; margin-bottom: 6px; text-align: center; }
.auth-card p { color: #94a3b8; font-size: 0.85rem; text-align: center; margin-bottom: 20px; }
.form-group { margin-bottom: 14px; position: relative; }
.form-group label { display: block; font-size: 0.82rem; color: #94a3b8; margin-bottom: 5px; font-weight: 600; }
.form-group input { width: 100%; padding: 11px; background: rgba(15, 23, 42, 0.9); border: 1px solid var(--border-color); border-radius: 8px; color: #fff; outline: none; }

.password-wrapper { position: relative; display: flex; align-items: center; }
.password-wrapper input { padding-right: 40px; }
.toggle-password { position: absolute; right: 12px; color: #94a3b8; cursor: pointer; font-size: 0.95rem; }
.toggle-password:hover { color: var(--primary); }

.forgot-link { text-align: right; display: none; margin-top: 5px; font-size: 0.78rem; color: var(--primary); text-decoration: none; cursor: pointer; }
.forgot-link:hover { text-decoration: underline; }

.btn-submit { width: 100%; padding: 12px; background: linear-gradient(135deg, #38bdf8, #2563eb); border: none; border-radius: 8px; color: #fff; font-weight: 700; cursor: pointer; margin-top: 12px; font-size: 0.95rem; }
.toggle-auth { text-align: center; margin-top: 15px; font-size: 0.82rem; color: #94a3b8; }
.toggle-auth a { color: var(--primary); text-decoration: none; font-weight: 700; cursor: pointer; }

/* Modal Styling for Forgot Password */
.modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); display:none; justify-content:center; align-items:center; z-index:99; }
.modal-box { background: #0f172a; border: 1px solid var(--border-color); padding: 20px; border-radius: 12px; width: 90%; max-width: 380px; }
</style>
</head>
<body>

<div class="auth-card">
    <h2 id="formTitle"><i class="fa-solid fa-user-plus"></i> वर्कर साइन-अप (Sign Up)</h2>
    <p id="formSub">खाता बनाकर सीधे डैशबोर्ड पर प्रवेश करें</p>

    <!-- साइन-अप में दिखेगा, लॉगिन में छुप जाएगा -->
    <div class="form-group" id="nameGroup">
        <label>पूरा नाम (Full Name)</label>
        <input type="text" id="workerName" placeholder="उदा. राहुल कुमार">
    </div>

    <!-- साइन-अप में दिखेगा, लॉगिन में छुप जाएगा -->
    <div class="form-group" id="phoneGroup">
        <label>फ़ोन / व्हाट्सएप नंबर</label>
        <input type="tel" id="workerPhone" placeholder="10 अंकों का मोबाइल नंबर">
    </div>

    <div class="form-group">
        <label>ईमेल आईडी (Email ID)</label>
        <input type="email" id="workerEmail" placeholder="example@gmail.com">
    </div>

    <!-- Password Input with Show/Hide Eye Button -->
    <div class="form-group">
        <label>पासवर्ड (Password)</label>
        <div class="password-wrapper">
            <input type="password" id="workerPassword" placeholder="न्यूनतम 6 अक्षर का पासवर्ड">
            <i class="fa-solid fa-eye toggle-password" id="eyeIcon" onclick="togglePasswordVisibility()"></i>
        </div>
        <!-- यह केवल लॉगिन मोड में दिखाई देगा -->
        <span class="forgot-link" id="forgotBtn" onclick="openForgotModal()">पासवर्ड भूल गए? (Forgot Password?)</span>
    </div>

    <button class="btn-submit" id="submitBtn" onclick="handleAuth()">
        <i class="fa-solid fa-check-circle"></i> खाता बनाएँ और आगे बढ़ें
    </button>

    <div class="toggle-auth">
        <span id="toggleText">पहले से खाता है?</span> <a id="toggleBtn" onclick="switchAuthMode()">लॉगिन करें</a>
    </div>
</div>

<!-- FORGOT PASSWORD MODAL (केवल लॉगिन के समय काम करेगा) -->
<div class="modal-overlay" id="forgotModal">
    <div class="modal-box">
        <h3 style="color:var(--primary); margin-bottom:10px;"><i class="fa-solid fa-key"></i> पासवर्ड रिसेट करें</h3>
        <p style="font-size:0.8rem; color:#94a3b8; margin-bottom:12px;">अपनी पंजीकृत ईमेल आईडी डालें। हम रिसेट लिंक भेजेंगे:</p>
        <div class="form-group">
            <input type="email" id="resetEmail" placeholder="example@gmail.com">
        </div>
        <div style="display:flex; gap:10px;">
            <button class="btn-submit" style="margin-top:0;" onclick="sendPasswordReset()">लिंक भेजें</button>
            <button style="background:#334155; color:#fff; border:none; padding:8px 14px; border-radius:6px; cursor:pointer;" onclick="closeForgotModal()">रद्द करें</button>
        </div>
    </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyCVsmFa6Xr-_EfUqh_ZS6tmzBwcdMZq0JA",
    authDomain: "universal-portal-dashboard.firebaseapp.com",
    projectId: "universal-portal-dashboard",
    storageBucket: "universal-portal-dashboard.firebasestorage.app",
    messagingSenderId: "403036962443",
    appId: "1:403036962443:web:5a15ac684c76efd2c3de8e"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

let isLoginMode = false; // डिफॉल्ट रूप से Sign Up मोड चालू रहेगा
const urlParams = new URLSearchParams(window.location.search);
const inviteWorkerId = urlParams.get('workerId');

// Sign-Up और Login के बीच स्विच करने वाला फ़ंक्शन
function switchAuthMode() {
    isLoginMode = !isLoginMode;

    // साइन-अप में नाम और फोन दिखेगा, लॉगिन में छुप जाएगा
    document.getElementById('nameGroup').style.display = isLoginMode ? 'none' : 'block';
    document.getElementById('phoneGroup').style.display = isLoginMode ? 'none' : 'block';

    // "Forgot Password" केवल लॉगिन मोड में ही दिखेगा!
    document.getElementById('forgotBtn').style.display = isLoginMode ? 'block' : 'none';

    // UI टेक्स्ट चेंज
    document.getElementById('formTitle').innerHTML = isLoginMode 
        ? '<i class="fa-solid fa-right-to-bracket"></i> वर्कर लॉगिन (Login)' 
        : '<i class="fa-solid fa-user-plus"></i> वर्कर साइन-अप (Sign Up)';

    document.getElementById('formSub').innerText = isLoginMode 
        ? 'अपने खाते में प्रवेश करें' 
        : 'खाता बनाकर सीधे डैशबोर्ड पर प्रवेश करें';

    document.getElementById('submitBtn').innerHTML = isLoginMode 
        ? '<i class="fa-solid fa-right-to-bracket"></i> लॉगिन करें' 
        : '<i class="fa-solid fa-check-circle"></i> खाता बनाएँ और आगे बढ़ें';

    document.getElementById('toggleText').innerText = isLoginMode ? 'खाता नहीं है?' : 'पहले से खाता है?';
    document.getElementById('toggleBtn').innerText = isLoginMode ? 'साइन-अप करें' : 'लॉगिन करें';
}

// 1. Password Show / Hide Toggle
function togglePasswordVisibility() {
    const pwdInput = document.getElementById('workerPassword');
    const eyeIcon = document.getElementById('eyeIcon');
    if (pwdInput.type === "password") {
        pwdInput.type = "text";
        eyeIcon.className = "fa-solid fa-eye-slash toggle-password";
    } else {
        pwdInput.type = "password";
        eyeIcon.className = "fa-solid fa-eye toggle-password";
    }
}

// 2. Forgot Password Modal Functions
function openForgotModal() { document.getElementById('forgotModal').style.display = 'flex'; }
function closeForgotModal() { document.getElementById('forgotModal').style.display = 'none'; }

function sendPasswordReset() {
    const email = document.getElementById('resetEmail').value.trim();
    if (!email) return alert("कृपया ईमेल दर्ज करें!");
    firebase.auth().sendPasswordResetEmail(email).then(() => {
        alert("पासवर्ड रिसेट लिंक आपकी ईमेल पर भेज दिया गया है!");
        closeForgotModal();
    }).catch(e => alert("त्रुटि: " + e.message));
}

// 3. Invite Data Load
window.onload = async function() {
    if (inviteWorkerId) {
        try {
            const doc = await firebase.firestore().collection("workers").doc(inviteWorkerId).get();
            if (doc.exists) {
                const data = doc.data();
                if (data.name) document.getElementById('workerName').value = data.name;
                if (data.phone) document.getElementById('workerPhone').value = data.phone;
            }
        } catch(e) { console.error("Invite error", e); }
    }
};

// 4. Submit Action (Sign Up or Login)
async function handleAuth() {
    const email = document.getElementById('workerEmail').value.trim().toLowerCase();
    const password = document.getElementById('workerPassword').value.trim();
    const submitBtn = document.getElementById('submitBtn');

    if (!email || !password) return alert("कृपया ईमेल और पासवर्ड भरें!");

    submitBtn.disabled = true;
    submitBtn.innerText = "जाँच की जा रही है...";

    try {
        if (isLoginMode) {
            // LOGIN LOGIC
            const cred = await firebase.auth().signInWithEmailAndPassword(email, password);
            localStorage.setItem("loggedWorkerId", cred.user.uid);
            window.location.href = "worker-dashboard.html";
        } else {
            // SIGN UP LOGIC
            const name = document.getElementById('workerName').value.trim();
            const phone = document.getElementById('workerPhone').value.trim();
            if (!name || !phone) { submitBtn.disabled = false; return alert("नाम और फोन नंबर भरना आवश्यक है!"); }

            const cred = await firebase.auth().createUserWithEmailAndPassword(email, password);
            const user = cred.user;
            const targetDocId = inviteWorkerId ? inviteWorkerId : user.uid;

            await firebase.firestore().collection("workers").doc(targetDocId).set({
                uid: user.uid,
                name: name,
                phone: phone,
                email: email,
                status: "Pending Profile Fill",
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });

            localStorage.setItem("loggedWorkerId", targetDocId);
            window.location.href = "worker-dashboard.html";
        }
    } catch (err) {
        alert("त्रुटि: " + err.message);
        submitBtn.disabled = false;
        submitBtn.innerText = isLoginMode ? "लॉगिन करें" : "खाता बनाएँ";
    }
}
</script>
</body>
    </html>
