<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worker Login / Signup</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>:root{--primary:#38bdf8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#0f172a;color:#f8fafc;font:15px system-ui,sans-serif}.card{width:min(100%,520px);padding:25px;border:1px solid #ffffff20;border-radius:16px;background:#1e293b}h1{font-size:1.35rem;color:var(--primary)}.field{margin:13px 0}.field label{display:block;color:#cbd5e1;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;background:#0f172a;color:white;border:1px solid #ffffff30;border-radius:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.row{display:flex;gap:8px}.row button,button.submit{border:0;padding:11px;border-radius:8px;cursor:pointer;font-weight:700}.row button{flex:1;background:#334155;color:white}.row button.active,button.submit{background:var(--primary);color:#082f49}.submit{width:100%;margin-top:8px}.hint{font-size:.8rem;color:#94a3b8}.error{color:#fecaca;white-space:pre-wrap}.powered{text-align:center;color:#94a3b8;font-size:.76rem;margin-top:14px}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><main class="card"><h1>Worker Portal</h1><p class="hint">Your worker profile is looked up by Firebase UID, with a verified-email migration path for older records. Login never creates or resets a profile.</p><div class="row"><button id="signupTab" class="active" type="button" onclick="setMode('signup')">Sign up / Accept invite</button><button id="loginTab" type="button" onclick="setMode('login')">Login</button></div><form onsubmit="authWorker(event)"><div class="grid"><div class="field" id="nameField"><label>Full name *</label><input id="name" maxlength="100"></div><div class="field" id="phoneField"><label>Phone *</label><input id="phone" type="tel" maxlength="20"></div><div class="field" id="genderField"><label>Gender</label><select id="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div><div class="field" id="qualificationField"><label>Qualification</label><input id="qualification" maxlength="100"></div><div class="field" id="experienceField"><label>Experience</label><input id="experience" maxlength="100"></div><div class="field" id="skillsField"><label>Skills</label><input id="skills" maxlength="300"></div><div class="field" id="addressField" style="grid-column:1/-1"><label>Permanent address</label><textarea id="address" rows="2" maxlength="500"></textarea></div></div><div class="field"><label>Email</label><input id="email" type="email" required maxlength="254" autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" required minlength="6" autocomplete="new-password"></div><button id="submit" class="submit">Create account</button></form><p id="error" class="error" role="alert"></p><p class="powered">Powered by Eagle Network</p></main><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script><script>
const cfg={apiKey:'AIzaSyCVsmFa6Xr-_EfUqh_ZS6tmzBwcdMZq0JA',authDomain:'universal-portal-dashboard.firebaseapp.com',projectId:'universal-portal-dashboard',storageBucket:'universal-portal-dashboard.firebasestorage.app',messagingSenderId:'403036962443',appId:'1:403036962443:web:5a15ac684c76efd2c3de8e'};if(!firebase.apps.length)firebase.initializeApp(cfg);const params=new URLSearchParams(location.search),inviteId=params.get('workerId'),inviteToken=params.get('token');if(inviteId){document.getElementById('name').value=params.get('name')||'';document.getElementById('phone').value=params.get('phone')||''}let mode='signup';function setMode(m){mode=m;for(const id of ['nameField','phoneField','genderField','qualificationField','experienceField','skillsField','addressField'])document.getElementById(id).hidden=m==='login';document.getElementById('signupTab').classList.toggle('active',m==='signup');document.getElementById('loginTab').classList.toggle('active',m==='login');document.getElementById('submit').textContent=m==='signup'?'Create account / accept invite':'Login';document.getElementById('password').autocomplete=m==='login'?'current-password':'new-password'}async function resolveWorker(user){const db=firebase.firestore();let snap=await db.collection('workers').doc(user.uid).get();if(snap.exists)return snap;if(user.email){const candidates=[user.email,user.email.toLowerCase(),user.email.toUpperCase()];for(const email of [...new Set(candidates)]){const result=await db.collection('workers').where('email','==',email).limit(2).get();if(result.docs.length===1){const legacy=result.docs[0];await legacy.ref.update({uid:user.uid,email:user.email,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});return legacy}if(result.docs.length>1)throw Error('Multiple legacy worker profiles match this email. Contact your operator to link the correct record.')}}return null}async function authWorker(e){e.preventDefault();const button=document.getElementById('submit'),error=document.getElementById('error');button.disabled=true;error.textContent='';try{const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value,db=firebase.firestore();let user;if(mode==='login'){user=(await firebase.auth().signInWithEmailAndPassword(email,password)).user;const profile=await resolveWorker(user);if(!profile)throw Error('No Firestore worker profile is linked to this account. Login did not create a blank profile. Use your operator invite or ask the operator to link the existing profile.')}else{const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim();if(!name||!phone)throw Error('Full name and phone are required.');user=(await firebase.auth().createUserWithEmailAndPassword(email,password)).user;const values={uid:user.uid,name,phone,email:user.email||email,gender:document.getElementById('gender').value,qualification:document.getElementById('qualification').value.trim(),experience:document.getElementById('experience').value.trim(),skills:document.getElementById('skills').value.trim(),address:document.getElementById('address').value.trim(),status:'Pending Profile Fill',updatedAt:firebase.firestore.FieldValue.serverTimestamp()};if(inviteId){if(!inviteToken)throw Error('Invite token is missing. Ask the operator to resend the invitation.');const ref=db.collection('workers').doc(inviteId),invite=await ref.get();if(!invite.exists||invite.data().inviteToken!==inviteToken||invite.data().uid)throw Error('This invite is invalid or already claimed. Ask your operator to create a new invite.');const complete=values.qualification&&values.experience&&values.skills&&values.address;values.status=complete?'Active':'Pending Profile Fill';values.inviteToken=inviteToken;values.registeredAt=firebase.firestore.FieldValue.serverTimestamp();await ref.update(values)}else{values.status=values.qualification&&values.experience&&values.skills&&values.address?'Active':'Pending Profile Fill';values.createdAt=firebase.firestore.FieldValue.serverTimestamp();await db.collection('workers').doc(user.uid).set(values,{merge:true})}}location.replace('worker-dashboard.html')}catch(err){error.textContent=err.message||'Unable to complete sign-in.';button.disabled=false}}
</script></body></html>
