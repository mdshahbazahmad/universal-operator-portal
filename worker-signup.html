<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worker Login / Signup</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>
:root{--primary:#38bdf8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#0f172a;color:#f8fafc;font:15px system-ui,sans-serif}.card{width:min(100%,450px);padding:25px;border:1px solid #ffffff20;border-radius:16px;background:#1e293b}h1{font-size:1.35rem;color:var(--primary)}.field{margin:13px 0}.field label{display:block;color:#cbd5e1;margin-bottom:5px}.field input{width:100%;padding:11px;background:#0f172a;color:white;border:1px solid #ffffff30;border-radius:8px}.row{display:flex;gap:8px}.row button,button.submit{border:0;padding:11px;border-radius:8px;cursor:pointer;font-weight:700}.row button{flex:1;background:#334155;color:white}.row button.active,button.submit{background:var(--primary);color:#082f49}.submit{width:100%;margin-top:8px}.hint{font-size:.8rem;color:#94a3b8}.error{color:#fecaca}.powered{text-align:center;color:#94a3b8;font-size:.76rem;margin-top:14px}
</style></head><body><main class="card"><h1>Worker Portal</h1><p class="hint">Sign in or create your worker account. Your profile is saved to Firestore.</p><div class="row"><button id="signupTab" class="active" onclick="setMode('signup')">Sign up</button><button id="loginTab" onclick="setMode('login')">Login</button></div><form onsubmit="authWorker(event)"><div class="field" id="nameField"><label for="name">Full name</label><input id="name" maxlength="100"></div><div class="field" id="phoneField"><label for="phone">Phone</label><input id="phone" type="tel" maxlength="20"></div><div class="field"><label for="email">Email</label><input id="email" type="email" required maxlength="254"></div><div class="field"><label for="password">Password</label><input id="password" type="password" required minlength="6" autocomplete="new-password"></div><button id="submit" class="submit">Create account</button></form><p id="error" class="error" role="alert"></p><p class="powered">Powered by Eagle Network</p></main>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script><script>
const cfg={apiKey:'AIzaSyCVsmFa6Xr-_EfUqh_ZS6tmzBwcdMZq0JA',authDomain:'universal-portal-dashboard.firebaseapp.com',projectId:'universal-portal-dashboard',storageBucket:'universal-portal-dashboard.firebasestorage.app',messagingSenderId:'403036962443',appId:'1:403036962443:web:5a15ac684c76efd2c3de8e'};if(!firebase.apps.length)firebase.initializeApp(cfg);let mode='signup';function setMode(m){mode=m;document.getElementById('nameField').hidden=m==='login';document.getElementById('phoneField').hidden=m==='login';document.getElementById('signupTab').classList.toggle('active',m==='signup');document.getElementById('loginTab').classList.toggle('active',m==='login');document.getElementById('submit').textContent=m==='signup'?'Create account':'Login'}async function authWorker(e){e.preventDefault();const button=document.getElementById('submit'),error=document.getElementById('error');error.textContent='';button.disabled=true;try{const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;let user;if(mode==='login')user=(await firebase.auth().signInWithEmailAndPassword(email,password)).user;else{const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim();if(!name||!phone)throw new Error('Name and phone are required.');user=(await firebase.auth().createUserWithEmailAndPassword(email,password)).user;await firebase.firestore().collection('workers').doc(user.uid).set({uid:user.uid,name,phone,email,role:'Field Technician',status:'Pending Profile Fill',createdAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})}location.href='worker-dashboard.html'}catch(err){error.textContent=err.message;button.disabled=false}}firebase.auth().onAuthStateChanged(user=>{if(user&&location.pathname.endsWith('worker-signup.html')){ /* keep auth page available for account switching */ }});
</script></body></html>
