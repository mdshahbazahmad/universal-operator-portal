<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worker Onboarding & Complete Bio-Data Form</title>
<!-- FontAwesome & Google Fonts -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
body { background: #070a12; color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.form-box { width: 100%; max-width: 600px; background: rgba(15, 23, 42, 0.9); padding: 25px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(10px); }
h2 { font-size: 1.25rem; color: #38bdf8; margin-bottom: 15px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
label { display: block; font-size: 0.82rem; margin-top: 8px; margin-bottom: 4px; color: #94a3b8; font-weight: 600; }
input, select, textarea { width: 100%; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: #fff; outline: none; font-size: 0.88rem; }
input:focus, select:focus, textarea:focus { border-color: #38bdf8; }
.preview-img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid #38bdf8; margin-top: 6px; display: none; }
button { width: 100%; padding: 13px; background: linear-gradient(135deg, #38bdf8, #2563eb); color: #fff; border: none; font-size: 0.95rem; font-weight: 800; border-radius: 8px; cursor: pointer; margin-top: 20px; }
.auth-toggle { text-align: center; margin-top: 15px; font-size: 0.85rem; color: #94a3b8; }
.auth-toggle a { color: #38bdf8; text-decoration: none; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>

<div class="form-box">
  <h2><i class="fa-solid fa-address-card"></i> वर्कर बायोडाटा एवं प्रोफाइल रजिस्ट्रेशन</h2>

  <!-- SIGN UP FORM -->
  <form id="workerSignupForm" onsubmit="handleWorkerSignup(event)">
    <div class="form-grid">
      <div>
        <label>ईमेल आईडी (Email Address)</label>
        <input type="email" id="wEmail" placeholder="worker@eaglenetwork.com" required>
      </div>

      <div>
        <label>नया पासवर्ड (Create Password)</label>
        <input type="password" id="wPassword" placeholder="••••••••" required>
      </div>

      <div>
        <label>पिता का नाम (Father's Name)</label>
        <input type="text" id="wFatherName" placeholder="श्री..." required>
      </div>

      <div>
        <label>माता का नाम (Mother's Name)</label>
        <input type="text" id="wMotherName" placeholder="श्रीमती..." required>
      </div>

      <div>
        <label>वैवाहिक स्थिति (Marital Status)</label>
        <select id="wMaritalStatus">
          <option value="Single/Unmarried">अविवाहित (Unmarried)</option>
          <option value="Married">विवाहित (Married)</option>
        </select>
      </div>

      <div>
        <label>आधार कार्ड नंबर (Aadhaar Number)</label>
        <input type="text" id="wAadhaarNo" placeholder="12 अंकों का आधार नंबर" maxlength="12" required>
      </div>
    </div>

    <label>पूरा वर्तमान पता (Full Address)</label>
    <textarea id="wAddress" rows="2" placeholder="मकान नंबर, गली, इलाका, पिनकोड" required></textarea>

    <div class="form-grid">
      <div>
        <label>अनुभव (Experience in Years)</label>
        <input type="text" id="wExperience" placeholder="उदा. 3 साल का फ़ाइबर स्प्लिसिंग का काम" required>
      </div>

      <div>
        <label>आपकी मुख्य स्किल्स (Skills)</label>
        <input type="text" id="wSkills" placeholder="ONT Setup, Fiber Splicing, Router Config" required>
      </div>
    </div>

    <!-- Gallery File Upload for Profile Photo -->
    <div>
      <label><i class="fa-solid fa-image"></i> प्रोफाइल फोटो चुनें (गैलरी से सेलेक्ट करें)</label>
      <input type="file" id="wPhotoFile" accept="image/*" onchange="previewProfilePhoto(event)">
      <img id="photoPreview" class="preview-img" alt="Profile Preview">
    </div>

    <button type="submit" id="btnSignup">बायोडाटा जमा करें एवं सब-डैशबोर्ड खोलें</button>
    
    <div class="auth-toggle">
      पहले से अकाउंट पंजीकृत है? <a onclick="toggleAuthMode('login')">यहाँ लॉगिन करें</a>
    </div>
  </form>

  <!-- LOGIN FORM -->
  <form id="workerLoginForm" style="display:none;" onsubmit="handleWorkerLogin(event)">
    <label>ईमेल आईडी (Email Address)</label>
    <input type="email" id="loginEmail" placeholder="worker@eaglenetwork.com" required>

    <label>पासवर्ड (Password)</label>
    <input type="password" id="loginPassword" placeholder="••••••••" required>

    <button type="submit" id="btnLogin">लॉगिन करें</button>
    
    <div class="auth-toggle">
      नया वर्कर इनवाइट मिला है? <a onclick="toggleAuthMode('signup')">साइन-अप करें</a>
    </div>
  </form>
</div>

<!-- Firebase SDK Compat -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCVsmFa6Xr-_EfUqh_ZS6tmzBwcdMZq0JA",
  authDomain: "universal-portal-dashboard.firebaseapp.com",
  projectId: "universal-portal-dashboard",
  storageBucket: "universal-portal-dashboard.firebasestorage.app",
  messagingSenderId: "403036962443",
  appId: "1:403036962443:web:5a15ac684c76efd2c3de8e"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}

const urlParams = new URLSearchParams(window.location.search);
const workerId = urlParams.get('workerId');
let uploadedPhotoBase64 = "https://i.ibb.co/cKBTN905/IMG-20260821-WA0005.jpg";

function toggleAuthMode(mode) {
  if (mode === 'login') {
    document.getElementById('workerSignupForm').style.display = 'none';
    document.getElementById('workerLoginForm').style.display = 'block';
  } else {
    document.getElementById('workerSignupForm').style.display = 'block';
    document.getElementById('workerLoginForm').style.display = 'none';
  }
}

// Automatic Gallery Photo Processing (Base64 Conversion)
function previewProfilePhoto(event) {
  const file = event.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      uploadedPhotoBase64 = e.target.result;
      const img = document.getElementById('photoPreview');
      img.src = uploadedPhotoBase64;
      img.style.display = 'block';
    };
    reader.readAsDataURL(file);
  }
}

// Handle Worker Signup
function handleWorkerSignup(e) {
  e.preventDefault();
  const email = document.getElementById('wEmail').value.trim();
  const password = document.getElementById('wPassword').value.trim();
  const btn = document.getElementById('btnSignup');
  
  if(!workerId) {
    alert("अवैध या मियाद ख़त्म इनवाइट लिंक!");
    return;
  }

  btn.innerText = "खाता बनाया जा रहा है...";
  btn.disabled = true;

  firebase.auth().createUserWithEmailAndPassword(email, password)
    .then((userCredential) => {
      const uid = userCredential.user.uid;
      return firebase.firestore().collection("workers").doc(workerId).update({
        authUserUid: uid,
        email: email,
        fatherName: document.getElementById('wFatherName').value.trim(),
        motherName: document.getElementById('wMotherName').value.trim(),
        maritalStatus: document.getElementById('wMaritalStatus').value,
        aadhaarNo: document.getElementById('wAadhaarNo').value.trim(),
        address: document.getElementById('wAddress').value.trim(),
        experience: document.getElementById('wExperience').value.trim(),
        skills: document.getElementById('wSkills').value.trim(),
        photoUrl: uploadedPhotoBase64,
        status: "Active",
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    })
    .then(() => {
      alert("बायोडाटा सफलतापूर्वक पंजीकृत हो गया है!");
      window.location.href = "worker-dashboard.html?workerId=" + workerId;
    })
    .catch((error) => {
      btn.innerText = "बायोडाटा जमा करें एवं सब-डैशबोर्ड खोलें";
      btn.disabled = false;
      alert("Error: " + error.message);
    });
}

// Handle Worker Login
function handleWorkerLogin(e) {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  const btn = document.getElementById('btnLogin');

  btn.innerText = "प्रमाणित किया जा रहा है...";
  btn.disabled = true;

  firebase.auth().signInWithEmailAndPassword(email, password)
    .then((userCredential) => {
      const uid = userCredential.user.uid;
      return firebase.firestore().collection("workers").where("authUserUid", "==", uid).get();
    })
    .then((snapshot) => {
      btn.innerText = "लॉगिन करें";
      btn.disabled = false;
      if (!snapshot.empty) {
        const docId = snapshot.docs[0].id;
        window.location.href = "worker-dashboard.html?workerId=" + docId;
      } else {
        alert("आपका वर्कर प्रोफाइल नहीं मिला। ऑपरेटर से इनवाइट प्राप्त करें।");
      }
    })
    .catch((error) => {
      btn.innerText = "लॉगिन करें";
      btn.disabled = false;
      alert("Login Error: " + error.message);
    });
}
</script>
</body>
</html>
