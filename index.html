<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Portal Dashboard</title>
  
  <!-- Firebase SDK Modules -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Single Active Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCVsmFa6Xr-_EfUqh_ZS6tmzBwcdMZq0JA",
      authDomain: "universal-portal-dashboard.firebaseapp.com",
      projectId: "universal-portal-dashboard",
      storageBucket: "universal-portal-dashboard.firebasestorage.app",
      messagingSenderId: "403036962443",
      appId: "1:403036962443:web:5a15ac684c76efd2c3de8e"
    };

    // Initialize Firebase
    try {
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      console.log("Firebase Connected Successfully!");
    } catch (error) {
      console.error("Firebase Connection Error:", error);
    }
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar Styles */
    .sidebar {
      width: 250px;
      background-color: #1e293b;
      color: #fff;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .sidebar h2 {
      font-size: 20px;
      margin-bottom: 30px;
      color: #38bdf8;
      text-align: center;
    }

    .sidebar ul {
      list-style: none;
    }

    .sidebar ul li {
      margin-bottom: 15px;
    }

    .sidebar ul li a {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 16px;
      display: block;
      padding: 10px;
      border-radius: 6px;
      transition: 0.3s;
    }

    .sidebar ul li a:hover, .sidebar ul li a.active {
      background-color: #0284c7;
      color: #fff;
    }

    /* Main Content Styles */
    .main-content {
      flex: 1;
      padding: 30px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      padding: 15px 25px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 24px;
      color: #0f172a;
    }

    .user-profile {
      font-weight: 600;
      color: #475569;
    }

    /* Dashboard Cards Grid */
    .dashboard-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border-left: 5px solid #0284c7;
    }

    .card h3 {
      font-size: 16px;
      color: #64748b;
      margin-bottom: 10px;
    }

    .card .value {
      font-size: 28px;
      font-weight: bold;
      color: #0f172a;
    }

    /* Welcome Section */
    .welcome-banner {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      padding: 25px;
      border-radius: 8px;
      margin-bottom: 25px;
    }

    .welcome-banner h2 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .welcome-banner p {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>Universal Portal</h2>
    <ul>
      <li><a href="#" class="active">Dashboard</a></li>
      <li><a href="#">Users</a></li>
      <li><a href="#">Analytics</a></li>
      <li><a href="#">Settings</a></li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    
    <div class="header">
      <h1>Dashboard Overview</h1>
      <div class="user-profile">Admin Account</div>
    </div>

    <!-- Welcome Banner -->
    <div class="welcome-banner">
      <h2>Welcome Back to Universal Portal Dashboard!</h2>
      <p>Your system is active and connected securely to Firebase Services.</p>
    </div>

    <!-- Metric Cards -->
    <div class="dashboard-cards">
      <div class="card">
        <h3>Total Users</h3>
        <div class="value">1,248</div>
      </div>
      <div class="card">
        <h3>Active Sessions</h3>
        <div class="value">342</div>
      </div>
      <div class="card">
        <h3>System Status</h3>
        <div class="value" style="color: #16a34a; font-size: 20px;">Online</div>
      </div>
    </div>

  </div>

<!-- Firebase Connection Code -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCVsmFa6Xr-_EfUqh_ZS6tmzBwcdMZq0JA",
    authDomain: "universal-portal-dashboard.firebaseapp.com",
    projectId: "universal-portal-dashboard",
    storageBucket: "universal-portal-dashboard.firebasestorage.app",
    messagingSenderId: "403036962443",
    appId: "1:403036962443:web:5a15ac684c76efd2c3de8e"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
</script>
</body>
</html>
