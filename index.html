<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f172a"><title>Universal Operator Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root{--primary:#38bdf8;--bg:#0f172a;--card:#1e293b;--muted:#94a3b8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,#164e6380,transparent 35%),var(--bg);color:#f8fafc;font:16px system-ui,sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(100%,440px);padding:28px;background:var(--card);border:1px solid #ffffff20;border-radius:20px;box-shadow:0 20px 70px #0008}h1{font-size:1.55rem;color:var(--primary);margin:0 0 8px}p{color:var(--muted);margin:0 0 20px}.tabs{display:flex;gap:8px;margin-bottom:20px}.tabs button,.submit{border:0;border-radius:9px;padding:12px;cursor:pointer;font-weight:700}.tabs button{flex:1;background:#0f172a;color:#cbd5e1}.tabs button.active,.submit{background:var(--primary);color:#082f49}.field{margin:14px 0}.field label{display:block;color:#cbd5e1;font-size:.87rem;margin-bottom:6px}.field input{width:100%;padding:12px;border-radius:9px;border:1px solid #ffffff2a;background:#0f172a;color:white}.submit{width:100%;margin-top:8px}.error{display:none;color:#fecaca;background:#7f1d1d;padding:10px;border-radius:8px;margin-bottom:12px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.brand img{width:42px;height:42px;border-radius:50%;object-fit:cover}.powered{text-align:center;color:#94a3b8;font-size:.78rem;margin:18px 0 0}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><img src="https://i.ibb.co/cKBTN905/IMG-20260821-WA0005.jpg" alt="Eagle Network"><div><strong>Eagle Network</strong><div style="font-size:.78rem;color:#94a3b8">Universal Operator Portal</div></div></div>
    <h1 id="title">Sign in to your portal</h1><p>Secure access for operator accounts.</p>
    <div class="tabs"><button id="loginTab" class="active" type="button" onclick="switchMode('login')">Login</button><button id="registerTab" type="button" onclick="switchMode('register')">Sign up</button></div>
    <div id="error" class="error" role="alert"></div>
    <form id="authForm" onsubmit="submitAuth(event)">
      <div class="field" id="nameField" hidden><label for="company">Company name</label><input id="company" maxlength="80" autocomplete="organization"></div>
      <div class="field" id="logoField" hidden><label for="logoFile">Company logo (optional, max 300 KB)</label><input id="logoFile" type="file" accept="image/*"></div>
      <div class="field" id="colorField" hidden><label for="themeColor">Primary theme color</label><input id="themeColor" type="color" value="#38bdf8"></div>
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required maxlength="254"></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required minlength="6"></div>
      <button id="submit" class="submit" type="submit">Login</button>
    </form>
    <p class="powered">Powered by Eagle Network</p>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script>
    const config={apiKey:'AIzaSyCVsmFa6Xr-_EfUqh_ZS6tmzBwcdMZq0JA',authDomain:'universal-portal-dashboard.firebaseapp.com',projectId:'universal-portal-dashboard',storageBucket:'universal-portal-dashboard.firebasestorage.app',messagingSenderId:'403036962443',appId:'1:403036962443:web:5a15ac684c76efd2c3de8e'};if(!firebase.apps.length)firebase.initializeApp(config);
    let mode='login';function switchMode(value){mode=value;document.getElementById('loginTab').classList.toggle('active',mode==='login');document.getElementById('registerTab').classList.toggle('active',mode==='register');for(const id of ['nameField','logoField','colorField'])document.getElementById(id).hidden=mode!=='register';document.getElementById('title').textContent=mode==='login'?'Sign in to your portal':'Create your operator account';document.getElementById('submit').textContent=mode==='login'?'Login':'Create account';document.getElementById('error').style.display='none'}
    function readImage(file){return new Promise((resolve,reject)=>{if(!file)return resolve('');if(!file.type.startsWith('image/')||file.size>300*1024)return reject(new Error('Choose an image no larger than 300 KB.'));const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('Could not read the logo file.'));r.readAsDataURL(file)})}
    async function submitAuth(event){event.preventDefault();const button=document.getElementById('submit'),error=document.getElementById('error');error.style.display='none';button.disabled=true;try{const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;let user;if(mode==='register'){const company=document.getElementById('company').value.trim();if(!company)throw new Error('Enter your company name.');const logo=await readImage(document.getElementById('logoFile').files[0]);user=(await firebase.auth().createUserWithEmailAndPassword(email,password)).user;const brand={uid:user.uid,companyName:company,logoUrl:logo,themeColor:document.getElementById('themeColor').value,createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()};await firebase.firestore().collection('operators').doc(user.uid).set(brand,{merge:true});await firebase.firestore().collection('users').doc(user.uid).set({uid:user.uid,name:company,email,role:'operator',createdAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})}else user=(await firebase.auth().signInWithEmailAndPassword(email,password)).user;window.location.href='dashboard.html'}catch(err){error.textContent=err.message||'Unable to sign in.';error.style.display='block';button.disabled=false}}
    firebase.auth().onAuthStateChanged(user=>{if(user)window.location.replace('dashboard.html')});
  </script>
</body></html>
