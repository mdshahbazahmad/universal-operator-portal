<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <!-- user-scalable=yes से अब मोबाइल पर Zoom काम करेगा -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Eagle Network SBZ - Universal Portal</title>

    <!-- FontAwesome & Google Fonts -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #38bdf8;
            --accent-gold: #fbbf24;
            --bg-dark: #070a12;
            --text-color: #f8fafc;
            --sidebar-bg: #0f172a;
            --header-bg: rgba(15, 23, 42, 0.95);
            --border-color: rgba(255, 255, 255, 0.1);
            --widget-bg: rgba(255, 255, 255, 0.05);
        }

        /* Light Theme Settings */
        body.light-theme {
            --bg-dark: #f8fafc;
            --text-color: #0f172a;
            --sidebar-bg: #ffffff;
            --header-bg: #ffffff;
            --border-color: #e2e8f0;
            --widget-bg: #f1f5f9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background 0.2s ease, color 0.2s ease;
        }

        html, body {
            min-height: 100%;
            width: 100%;
            background: var(--bg-dark);
            color: var(--text-color);
        }

        .app-wrapper {
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        /* Mobile Top Bar */
        .mobile-header {
            display: none;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: var(--sidebar-bg);
            border-bottom: 1px solid var(--border-color);
            z-index: 200;
        }

        .mobile-header .menu-toggle {
            font-size: 1.3rem;
            color: var(--text-color);
            cursor: pointer;
        }

        /* Sidebar Navigation */
        aside.sidebar {
            width: 230px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 16px 12px;
            z-index: 100;
            flex-shrink: 0;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 14px;
        }

        .brand-header img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--accent-gold);
            object-fit: cover;
        }

        .brand-header h2 {
            font-size: 0.90rem;
            font-weight: 800;
            color: var(--text-color);
            line-height: 1.2;
        }

        .brand-header span {
            font-size: 0.70rem;
            color: var(--primary);
            font-weight: 700;
        }

        .nav-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .nav-item a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            color: #94a3b8;
            text-decoration: none;
            font-weight: 600;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .nav-item.active a, .nav-item a:hover {
            background: rgba(56, 189, 248, 0.15);
            color: var(--primary);
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .user-footer {
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .user-details strong {
            display: block;
            font-size: 0.80rem;
            color: var(--text-color);
        }

        .user-details span {
            font-size: 0.70rem;
            color: #94a3b8;
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
        }

        /* Main Content Wrapper */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: calc(100vw - 230px);
            overflow: hidden;
            background: var(--bg-dark);
        }

        /* Top Header Area */
        header.top-header {
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 10px 20px;
            gap: 8px;
            z-index: 90;
            flex-shrink: 0;
        }

        .header-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .operator-brand-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .operator-brand-info img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            object-fit: cover;
        }

        .operator-brand-info h1 {
            font-size: 1rem;
            font-weight: 800;
            color: var(--text-color);
        }

        .header-middle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--widget-bg);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 8px;
            width: 100%;
            gap: 10px;
        }

        .widget-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-color);
            white-space: nowrap;
        }

        .widget-item i {
            color: var(--primary);
        }

        .control-panel-title {
            font-size: 0.88rem;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.5px;
        }

        .theme-toggle-btn {
            background: var(--widget-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.9rem;
        }

        /* Content Frame */
        .content-frame-container {
            flex: 1;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        iframe#content-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: transparent;
        }

        /* Mobile & Tablet Rules */
        @media (max-width: 768px) {
            .app-wrapper { flex-direction: column; }
            .mobile-header { display: flex; }
            .operator-brand-info img { display: none; }

            aside.sidebar {
                position: fixed;
                top: 0;
                left: -240px;
                height: 100vh;
                width: 230px;
                z-index: 300;
                box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
                transition: left 0.3s ease;
            }

            aside.sidebar.open { left: 0; }
            .main-wrapper { width: 100vw; height: calc(100vh - 53px); }
            header.top-header { padding: 8px 12px; gap: 6px; }

            .header-middle-row {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 6px 10px;
                padding: 6px 10px;
            }
            .widget-item { font-size: 0.72rem; }
        }
    </style>
</head>
<body>

    <!-- Mobile Top Header Bar -->
    <div class="mobile-header">
        <div style="display:flex; align-items:center; gap:8px;">
            <img src="https://i.ibb.co/cKBTN905/IMG-20260821-WA0005.jpg" style="width:28px; height:28px; border-radius:50%;" alt="Logo">
            <strong style="font-size:0.88rem;">Eagle Network SBZ</strong>
        </div>
        <i class="fa-solid fa-bars menu-toggle" onclick="toggleSidebar()"></i>
    </div>

    <div class="app-wrapper">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="brand-header">
                <img src="https://i.ibb.co/cKBTN905/IMG-20260821-WA0005.jpg" alt="Logo">
                <div>
                    <h2>Eagle Network SBZ</h2>
                    <span>Universal Portal</span>
                </div>
            </div>

            <ul class="nav-list">
                <li class="nav-item active">
                    <a href="modules/customers.html" target="content-frame">
                        <i class="fa-solid fa-users"></i> Customers
                    </a>
                </li>
                <li class="nav-item">
                    <a href="modules/billing.html" target="content-frame">
                        <i class="fa-solid fa-file-invoice-dollar"></i> Billing
                    </a>
                </li>
                <li class="nav-item">
                    <a href="modules/server.html" target="content-frame">
                        <i class="fa-solid fa-server"></i> Server Monitor
                    </a>
                </li>
                <li class="nav-item">
                    <a href="modules/whatsapp.html" target="content-frame">
                        <i class="fa-solid fa-comments"></i> WhatsApp Alert
                    </a>
                </li>
                <li class="nav-item">
                    <a href="modules/settings.html" target="content-frame">
                        <i class="fa-solid fa-gear"></i> Settings
                    </a>
                </li>
            </ul>

            <div class="user-footer">
                <div style="display:flex; align-items:center; gap:8px; overflow:hidden; flex:1;">
                    <i class="fa-solid fa-circle-user" style="font-size:1.4rem; color:var(--primary); flex-shrink:0;"></i>
                    <div class="user-details">
                        <strong id="user-display-name">Operator</strong>
                        <span id="user-display-email">loading...</span>
                    </div>
                </div>
                <button class="btn-logout" onclick="handleLogout()" title="Logout"><i class="fa-solid fa-power-off"></i></button>
            </div>
        </aside>

        <!-- Main Wrapper -->
        <div class="main-wrapper">
            
            <header class="top-header">
                <div class="header-top-row">
                    <div class="operator-brand-info">
                        <img src="https://i.ibb.co/cKBTN905/IMG-20260821-WA0005.jpg" alt="Operator Logo">
                        <h1>Eagle Network SBZ</h1>
                    </div>
                    
                    <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-btn" title="Toggle Theme">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                </div>

                <div class="header-middle-row">
                    <div class="widget-item">
                        <i class="fa-solid fa-clock"></i>
                        <span id="clock-time">00:00:00 AM</span>
                    </div>

                    <div class="widget-item">
                        <i class="fa-solid fa-calendar-days"></i>
                        <span id="clock-date">Loading...</span>
                    </div>

                    <div class="widget-item">
                        <i class="fa-solid fa-location-dot"></i>
                        <span id="user-location">लोकेशन...</span>
                    </div>

                    <div class="widget-item">
                        <span id="weather-icon">🌤️</span>
                        <span id="weather-temp">--°C</span>
                        <span id="weather-desc" style="opacity:0.8;"></span>
                    </div>
                </div>

                <div class="control-panel-title">
                    <i class="fa-solid fa-sliders"></i>
                    <span>OPERATOR CONTROL PANEL</span>
                </div>
            </header>

            <main class="content-frame-container">
                <iframe id="content-frame" name="content-frame" src="modules/customers.html"></iframe>
            </main>

        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCVsmFa6Xr-_EfUqh_ZS6tmzBwcdMZq0JA",
            authDomain: "universal-portal-dashboard.firebaseapp.com",
            projectId: "universal-portal-dashboard",
            storageBucket: "universal-portal-dashboard.firebasestorage.app",
            messagingSenderId: "403036962443",
            appId: "1:403036962443:web:5a15ac684c76efd2c3de8e"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        document.querySelectorAll('.nav-list a').forEach(link => {
            link.addEventListener('click', function() {
                document.querySelectorAll('.nav-list .nav-item').forEach(item => item.classList.remove('active'));
                this.parentElement.classList.add('active');

                if (window.innerWidth <= 768) {
                    document.getElementById('sidebar').classList.remove('open');
                }
            });
        });

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // डार्क/लाइट मोड के साथ Iframe के अंदर का थीम बदलना
        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            const themeBtn = document.getElementById('theme-btn');
            const isLight = document.body.classList.contains('light-theme');

            if (isLight) {
                themeBtn.innerHTML = '<i class="fa-solid fa-sun" style="color:#f59e0b;"></i>';
            } else {
                themeBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
            }

            // iframe को मैसेज भेजें ताकि उसका कंटेंट भी डार्क/लाइट हो जाए
            const iframe = document.getElementById('content-frame');
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage({ type: 'THEME_CHANGE', isLight: isLight }, '*');
            }
        }

        function updateClockAndDay() {
            const now = new Date();
            const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            const timeString = now.toLocaleTimeString('en-US', timeOptions);

            const dateOptions = { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' };
            const dateString = now.toLocaleDateString('en-US', dateOptions);

            const timeEl = document.getElementById('clock-time');
            const dateEl = document.getElementById('clock-date');

            if (timeEl) timeEl.innerText = timeString;
            if (dateEl) dateEl.innerText = dateString;
        }

        setInterval(updateClockAndDay, 1000);
        updateClockAndDay();

        function initAutoWeather() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        
                        try {
                            const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                            const geoData = await geoRes.json();
                            const city = geoData.address.city || geoData.address.town || geoData.address.suburb || "Location";
                            document.getElementById('user-location').innerText = city;
                        } catch (e) {
                            console.log("City fetch error:", e);
                        }

                        fetchWeatherData(lat, lon);
                    },
                    (error) => {
                        document.getElementById('user-location').innerText = "Shahdara, Delhi";
                        fetchWeatherData(28.67, 77.28); 
                    }
                );
            } else {
                fetchWeatherData(28.67, 77.28);
            }
        }

        async function fetchWeatherData(lat, lon) {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`;
            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data && data.current_weather) {
                    const temp = Math.round(data.current_weather.temperature);
                    const weatherCode = data.current_weather.weathercode;
                    document.getElementById('weather-temp').innerText = `${temp}°C`;

                    let icon = "☀️";
                    if (weatherCode >= 1 && weatherCode <= 3) icon = "⛅";
                    else if (weatherCode >= 45 && weatherCode <= 48) icon = "🌫️";
                    else if (weatherCode >= 51 && weatherCode <= 67) icon = "🌧️";
                    else if (weatherCode >= 80) icon = "⛈️";

                    document.getElementById('weather-icon').innerText = icon;
                }
            } catch (error) {
                console.error("Weather error:", error);
            }
        }

        initAutoWeather();
    </script>
</body>
</html>
