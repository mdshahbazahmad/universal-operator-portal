<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eagle Network SBZ - Dashboard</title>
    <!-- FontAwesome & Styling Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            min-height: 100vh;
        }
        /* Sidebar Styles */
        .sidebar {
            width: 260px;
            background: rgba(15, 23, 42, 0.95);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            padding: 24px 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: fixed;
            height: 100vh;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 30px;
        }
        .nav-links {
            list-style: none;
        }
        .nav-links li {
            margin-bottom: 10px;
        }
        .nav-links a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: #94a3b8;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }
        .nav-links a:hover, .nav-links a.active {
            background: #1e293b;
            color: #38bdf8;
        }
        /* Main Content Styles */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 30px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 16px 24px;
            border-radius: 12px;
            margin-bottom: 30px;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .user-profile i {
            font-size: 2rem;
            color: #38bdf8;
        }
        .logout-btn {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .logout-btn:hover {
            background: #dc2626;
        }
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .stat-card h3 {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        .stat-card .value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <div>
            <div class="brand">
                <i class="fa-solid fa-tower-cell"></i>
                <span>Eagle Network</span>
            </div>
            <ul class="nav-links">
                <li><a href="#" class="active"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
                <li><a href="#"><i class="fa-solid fa-users"></i> Subscribers</a></li>
                <li><a href="#"><i class="fa-solid fa-file-invoice-dollar"></i> Billing</a></li>
                <li><a href="#"><i class="fa-solid fa-gear"></i> Settings</a></li>
            </ul>
        </div>
    </div>

    <!-- Main Section -->
    <div class="main-content">
        <!-- Top Profile Bar -->
        <div class="header-top">
            <div class="user-profile">
                <i class="fa-solid fa-circle-user"></i>
                <div>
                    <!-- यहाँ फायरबेस से असली यूज़र का नाम आएगा -->
                    <h4 id="userNameDisplay">Loading User...</h4>
                    <small id="userEmailDisplay" style="color: #94a3b8;">Loading Email...</small>
                </div>
            </div>
            <button class="logout-btn" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </div>

        <!-- Dynamic Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Subscribers</h3>
                <div class="value" id="val-total-sub">0</div>
            </div>
            <div class="stat-card">
                <h3>Active Connections</h3>
                <div class="value" id="val-active-sub">0</div>
            </div>
            <div class="stat-card">
                <h3>Pending Invoices</h3>
                <div class="value" id="val-pending-sub">0</div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Compat Version -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
      // Firebase Config 
      const firebaseConfig = {
        apiKey: "AIzaSyCVsmFa6Xr-_EfUqh_ZS6tmzBwcdMZq0JA",
        authDomain: "universal-portal-dashboard.firebaseapp.com",
        projectId: "universal-portal-dashboard",
        storageBucket: "universal-portal-dashboard.firebasestorage.app",
        messagingSenderId: "403036962443",
        appId: "1:403036962443:web:5a15ac684c76efd2c3de8e"
      };

      // Firebase Initialize
      firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();
      const db = firebase.firestore();

      // Login State Checker (ऑथेंटिकेशन और डेटा रिफ्लेक्ट करने के लिए)
      auth.onAuthStateChanged((user) => {
        if (user) {
          // Firestore डेटाबेस से लॉगिन यूज़र का डेटा निकालना
          db.collection("users").doc(user.uid).get().then((doc) => {
            if (doc.exists && doc.data().name) {
              document.getElementById("userNameDisplay").innerText = doc.data().name;
            } else {
              document.getElementById("userNameDisplay").innerText = "Operator User";
            }
          }).catch((err) => {
            console.log("Firestore error:", err);
            document.getElementById("userNameDisplay").innerText = "Operator User";
          });

          // ईमेल दिखाना
          document.getElementById("userEmailDisplay").innerText = user.email || user.phoneNumber || "";
        } else {
          // अगर कोई बिना लॉगिन सीधे आएगा तो वापस index.html पर भेज दिया जाएगा
          window.location.href = "index.html";
        }
      });

      // Log out Function
      function handleLogout() {
        auth.signOut().then(() => {
          window.location.href = "index.html";
        });
      }
    </script>
</body>
</html>
