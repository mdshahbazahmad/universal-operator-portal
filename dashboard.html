<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eagle Network SBZ - Dashboard</title>
    <!-- FontAwesome & Styling Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            min-height: 100vh;
        }
        /* Sidebar Styles */
        .sidebar {
            width: 260px;
            background: rgba(15, 23, 42, 0.95);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            padding: 24px 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: fixed;
            height: 100vh;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 30px;
        }
        .nav-links {
            list-style: none;
        }
        .nav-links li {
            margin-bottom: 10px;
        }
        .nav-links a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: #94a3b8;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }
        .nav-links a:hover, .nav-links a.active {
            background: #1e293b;
            color: #38bdf8;
        }
        /* Main Content Styles */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 30px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 16px 24px;
            border-radius: 12px;
            margin-bottom: 30px;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .user-profile i {
            font-size: 2rem;
            color: #38bdf8;
        }
        .logout-btn {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .logout-btn:hover {
            background: #dc2626;
        }
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .stat-card h3 {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        .stat-card .value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #38bdf8;
        }
        .btn-add {
            background: linear-gradient(135deg, #38bdf8, #8b5cf6);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .table-card {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 20px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            margin-top: 15px;
        }
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        th { color: #94a3b8; font-weight: 600; }
        .badge-status {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .status-active { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .status-pending { background: rgba(234, 179, 8, 0.2); color: #eab308; }
        .btn-delete {
            background: transparent;
            border: none;
            color: #ef4444;
            cursor: pointer;
        }
        /* Modal Style */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .close-modal {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .form-field {
            margin-bottom: 15px;
        }
        .form-field label {
            display: block;
            margin-bottom: 5px;
            color: #94a3b8;
            font-size: 0.9rem;
        }
        .form-field input, .form-field select {
            width: 100%;
            padding: 10px;
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 6px;
            outline: none;
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <div>
            <div class="brand">
                <i class="fa-solid fa-tower-cell"></i>
                <span>Eagle Network</span>
            </div>
            <ul class="nav-links">
                <li><a href="#" class="active"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
                <li><a href="#"><i class="fa-solid fa-users"></i> Subscribers</a></li>
                <li><a href="#"><i class="fa-solid fa-file-invoice-dollar"></i> Billing</a></li>
                <li><a href="#"><i class="fa-solid fa-gear"></i> Settings</a></li>
            </ul>
        </div>
    </div>

    <!-- Main Section -->
    <div class="main-content">
        <!-- Top Profile Bar -->
        <div class="header-top">
            <div class="user-profile">
                <i class="fa-solid fa-circle-user"></i>
                <div>
                    <!-- यहाँ फायरबेस से असली यूज़र का नाम आएगा -->
                    <h4 id="userNameDisplay">Loading User...</h4>
                    <small id="userEmailDisplay" style="color: #94a3b8;">Loading Email...</small>
                </div>
            </div>
            <button class="logout-btn" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </div>

        <!-- Dynamic Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Subscribers</h3>
                <div class="value" id="val-total-sub">0</div>
            </div>
            <div class="stat-card">
                <h3>Active Connections</h3>
                <div class="value" id="val-active-sub">0</div>
            </div>
            <div class="stat-card">
                <h3>Pending Invoices</h3>
                <div class="value" id="val-pending-sub">0</div>
            </div>
            <div class="stat-card">
                <h3>Monthly Revenue</h3>
                <div class="value" id="val-revenue">₹0</div>
            </div>
        </div>

        <button class="btn-add" onclick="openModal()">
            <i class="fa-solid fa-user-plus"></i> Add Subscriber
        </button>

        <div class="table-card">
            <h3>Recent Subscribers List</h3>
            <table>
                <thead>
                    <tr>
                        <th>Subscriber Name</th>
                        <th>STB / Box ID</th>
                        <th>Active Plan</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="subscriber-list">
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Form for Adding Subscriber -->
    <div class="modal" id="customerModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="color:#fff;">Add New Subscriber</h3>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            <form id="add-subscriber-form" onsubmit="handleAddSubscriber(event)">
                <div class="form-field">
                    <label>Subscriber Name</label>
                    <input type="text" id="sub-name" placeholder="e.g. Rahul Sharma" required>
                </div>
                <div class="form-field">
                    <label>STB / Box ID</label>
                    <input type="text" id="sub-stb" placeholder="e.g. SBZ-109283" required>
                </div>
                <div class="form-field">
                    <label>Plan Type</label>
                    <select id="sub-plan">
                        <option value="HD Cable Pack (₹350)">HD Cable Pack (₹350)</option>
                        <option value="Fiber 100 Mbps (₹699)">Fiber 100 Mbps (₹699)</option>
                        <option value="Ultra Combo Pack (₹999)">Ultra Combo Pack (₹999)</option>
                    </select>
                </div>
                <div class="form-field">
                    <label>Payment Status</label>
                    <select id="sub-status">
                        <option value="Active">Active / Paid</option>
                        <option value="Pending">Pending / Due</option>
                    </select>
                </div>
                <button type="submit" class="btn-add" style="width: 100%; justify-content: center; margin-top: 10px;">
                    Save Subscriber
                </button>
            </form>
        </div>
    </div>

    <!-- Firebase SDK Compat Version -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
      // Firebase Config 
      const firebaseConfig = {
        apiKey: "AIzaSyCVsmFa6Xr-_EfUqh_ZS6tmzBwcdMZq0JA",
        authDomain: "universal-portal-dashboard.firebaseapp.com",
        projectId: "universal-portal-dashboard",
        storageBucket: "universal-portal-dashboard.firebasestorage.app",
        messagingSenderId: "403036962443",
        appId: "1:403036962443:web:5a15ac684c76efd2c3de8e"
      };

      // Firebase Initialize
      firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();
      const db = firebase.firestore();

      let subscribers = [];

      // Login State Checker
      auth.onAuthStateChanged((user) => {
        if (user) {
          db.collection("users").doc(user.uid).get().then((doc) => {
            if (doc.exists && doc.data().name) {
              document.getElementById("userNameDisplay").innerText = doc.data().name;
            } else {
              document.getElementById("userNameDisplay").innerText = "Operator User";
            }
          }).catch((err) => {
            console.log("Firestore error:", err);
            document.getElementById("userNameDisplay").innerText = "Operator User";
          });

          document.getElementById("userEmailDisplay").innerText = user.email || user.phoneNumber || "";
          
          // Firestore से लाइव ग्राहक डेटा लोड करना चालू करें
          loadSubscribers();
        } else {
          window.location.href = "index.html";
        }
      });

      // Log out Function
      function handleLogout() {
        auth.signOut().then(() => {
          window.location.href = "index.html";
        });
      }

      // Firestore से Real-time में डाटा लाएं
      function loadSubscribers() {
          db.collection("subscribers").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
              subscribers = [];
              snapshot.forEach((doc) => {
                  subscribers.push({ id: doc.id, ...doc.data() });
              });
              renderDashboard();
          });
      }

      // डैशबोर्ड टेबल और स्टैट्स अपडेट करें
      function renderDashboard() {
          const tbody = document.getElementById('subscriber-list');
          tbody.innerHTML = '';
          let totalRev = 0, activeCnt = 0, pendingCnt = 0;

          subscribers.forEach((sub) => {
              if (sub.status === 'Active') {
                  activeCnt++;
                  totalRev += (sub.price || 0);
              } else {
                  pendingCnt++;
              }

              const tr = document.createElement('tr');
              tr.innerHTML = `
                  <td style="font-weight:600;">${sub.name}</td>
                  <td style="color:#38bdf8;">${sub.stb}</td>
                  <td>${sub.plan}</td>
                  <td><span class="badge-status ${sub.status === 'Active' ? 'status-active' : 'status-pending'}">${sub.status}</span></td>
                  <td><button class="btn-delete" onclick="deleteSubscriber('${sub.id}')"><i class="fa-solid fa-trash"></i></button></td>
              `;
              tbody.appendChild(tr);
          });

          document.getElementById('val-total-sub').innerText = subscribers.length;
          document.getElementById('val-active-sub').innerText = activeCnt;
          document.getElementById('val-pending-sub').innerText = pendingCnt;
          document.getElementById('val-revenue').innerText = `₹${totalRev.toLocaleString('en-IN')}`;
      }

      // नया ग्राहक Firestore में सेव करें
      function handleAddSubscriber(e) {
          e.preventDefault();
          const name = document.getElementById('sub-name').value;
          const stb = document.getElementById('sub-stb').value;
          const plan = document.getElementById('sub-plan').value;
          const status = document.getElementById('sub-status').value;
          
          const priceMatch = plan.match(/\d+/);
          const price = priceMatch ? parseInt(priceMatch[0]) : 0;

          db.collection("subscribers").add({
              name: name,
              stb: stb,
              plan: plan,
              price: price,
              status: status,
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
          }).then(() => {
              closeModal();
              document.getElementById('add-subscriber-form').reset();
          }).catch((error) => {
              alert("डेटा सेव करने में त्रुटि: " + error.message);
          });
      }

      // Firestore से ग्राहक डिलीट करें
      function deleteSubscriber(id) {
          if(confirm("क्या आप इस ग्राहक को हटाना चाहते हैं?")) {
              db.collection("subscribers").doc(id).delete().catch((error) => {
                  alert("हटाने में त्रुटि: " + error.message);
              });
          }
      }

      function openModal() { document.getElementById('customerModal').style.display = 'flex'; }
      function closeModal() { document.getElementById('customerModal').style.display = 'none'; }
    </script>
</body>
</html>
