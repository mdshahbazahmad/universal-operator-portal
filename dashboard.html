<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eagle Network SBZ - Universal Portal</title>

    <!-- FontAwesome & Google Fonts -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #38bdf8;
            --accent-gold: #fbbf24;
            --bg-dark: #070a12;
            --text-color: #f8fafc;
            --sidebar-bg: rgba(15, 23, 42, 0.95);
            --header-bg: rgba(15, 23, 42, 0.8);
            --card-bg: rgba(15, 23, 42, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --widget-bg: rgba(255, 255, 255, 0.05);
        }

        /* Light Theme Options */
        body.light-theme {
            --bg-dark: #f1f5f9;
            --text-color: #0f172a;
            --sidebar-bg: #ffffff;
            --header-bg: rgba(255, 255, 255, 0.9);
            --card-bg: #ffffff;
            --border-color: rgba(0, 0, 0, 0.1);
            --widget-bg: rgba(0, 0, 0, 0.04);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background 0.25s ease, color 0.25s ease;
        }

        body {
            min-height: 100vh;
            background: var(--bg-dark);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Layout Container */
        .app-wrapper {
            display: flex;
            flex: 1;
            height: 100vh;
            position: relative;
        }

        /* Mobile Header */
        .mobile-header {
            display: none;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: var(--sidebar-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 200;
        }

        .mobile-header .menu-toggle {
            font-size: 1.4rem;
            color: var(--text-color);
            cursor: pointer;
        }

        /* Sidebar Navigation (220px) */
        aside.sidebar {
            width: 220px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px 12px;
            z-index: 100;
            flex-shrink: 0;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .brand-header img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid var(--accent-gold);
            object-fit: cover;
        }

        .brand-header div {
            display: flex;
            flex-direction: column;
        }

        .brand-header h2 {
            font-size: 0.90rem;
            font-weight: 800;
            color: var(--text-color);
            line-height: 1.2;
        }

        .brand-header span {
            font-size: 0.72rem;
            color: var(--primary);
            font-weight: 700;
        }

        .nav-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .nav-item a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            color: #94a3b8;
            text-decoration: none;
            font-weight: 600;
            border-radius: 10px;
            font-size: 0.88rem;
        }

        .nav-item.active a, .nav-item a:hover {
            background: rgba(56, 189, 248, 0.15);
            color: var(--primary);
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        /* User Profile Box */
        .user-footer {
            padding-top: 14px;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .user-details {
            overflow: hidden;
            flex: 1;
        }

        .user-details strong {
            display: block;
            font-size: 0.82rem;
            color: var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-details span {
            font-size: 0.72rem;
            color: #94a3b8;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            flex-shrink: 0;
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        /* Main Area Layout */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Header Control Panel */
        header.top-header {
            height: 65px;
            background: var(--header-bg);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 90;
        }

        .header-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Right Side Live Widgets */
        .widgets-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .widget-box {
            background: var(--widget-bg);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-color);
        }

        .widget-box i {
            color: var(--primary);
        }

        /* Theme Switcher Button */
        .theme-toggle-btn {
            background: var(--widget-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
        }

        /* Iframe Container */
        .content-frame-container {
            flex: 1;
            width: 100%;
            height: calc(100vh - 65px);
            background: transparent;
        }

        iframe#content-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            .widget-box.date-box, .widget-box.temp-box {
                display: none; /* छोटी स्क्रीन पर कुछ विजेट हाइड होंगे */
            }
        }

        @media (max-width: 768px) {
            .app-wrapper { flex-direction: column; }
            .mobile-header { display: flex; }
            
            aside.sidebar {
                position: fixed;
                top: 0;
                left: -230px;
                height: 100vh;
                width: 220px;
                z-index: 300;
                box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
            }

            aside.sidebar.open { left: 0; }
            header.top-header { padding: 0 12px; }
            .header-title span { display: none; }
        }
    </style>
</head>
<body>

        </aside>

        <!-- Main Wrapper -->
        <div class="main-wrapper">
            
            <!-- Top Right Header Control Panel -->
            <header class="top-header">

                    <i class="fa-solid fa-sliders" style="color:var(--primary);"></i>

                <!-- Live Weather, Location & Clock Widget -->
<div class="weather-clock-card">
    <!-- 1. Live Location & Temperature Box -->
    <div class="location-weather-box">
        <div class="location-title">

</div>

                    <!-- Light/Dark Mode Switcher -->

                </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCVsmFa6Xr-_EfUqh_ZS6tmzBwcdMZq0JA",
            authDomain: "universal-portal-dashboard.firebaseapp.com",
            projectId: "universal-portal-dashboard",
            storageBucket: "universal-portal-dashboard.firebasestorage.app",
            messagingSenderId: "403036962443",
            appId: "1:403036962443:web:5a15ac684c76efd2c3de8e"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        // Sidebar Navigation Active Class & Mobile Close
        document.querySelectorAll('.nav-list a').forEach(link => {
            link.addEventListener('click', function() {
                document.querySelectorAll('.nav-list .nav-item').forEach(item => item.classList.remove('active'));

                if (window.innerWidth <= 768) {

                }
            });
        });

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // Theme Toggle (Light/Dark Mode)
        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            const themeBtn = document.getElementById('theme-btn');
            if (document.body.classList.contains('light-theme')) {
                themeBtn.innerHTML = '<i class="fa-solid fa-sun" style="color:#f59e0b;"></i>';
            } else {
                themeBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
            }
        }

        // ==========================================
// 1. Live Time + Day + Date Engine
// ==========================================
function updateClockAndDay() {
    const now = new Date();

    // 1. Time Format (12-Hour format with AM/PM)
    const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
    const timeString = now.toLocaleTimeString('en-US', timeOptions);

    // 2. Day & Date Format (e.g., Sunday, 06 Sep 2026)
    const dateOptions = { weekday: 'long', day: '2-digit', month: 'short', year: 'numeric' };
    const dateString = now.toLocaleDateString('en-US', dateOptions);

    const timeEl = document.getElementById('clock-time');
    const dateEl = document.getElementById('clock-date');

    if (timeEl) timeEl.innerText = timeString;
    if (dateEl) dateEl.innerText = dateString; // यहाँ Sunday, Friday जैसा दिन दिखेगा
}

setInterval(updateClockAndDay, 1000);
updateClockAndDay();


// ==========================================
// 2. Dynamic Auto-Location & Live Weather Engine
// ==========================================
function initAutoWeather() {
    // अगर यूज़र ने लोकेशन परमिशन दी है
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                
                // 1. Coordinates से शहर का नाम (Reverse Geocoding)
                try {
                    const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                    const geoData = await geoRes.json();
                    
                    const city = geoData.address.city || geoData.address.town || geoData.address.suburb || geoData.address.state_district || "Unknown Location";
                    const state = geoData.address.state || "";
                    
                    const locationEl = document.getElementById('user-location');
                    if (locationEl) locationEl.innerText = `${city}${state ? ', ' + state : ''}`;
                } catch (e) {
                    console.log("City name fetch error:", e);
                }

                // 2. उस लोकेशन का मौसम फ़ेच करना
                fetchWeatherData(lat, lon);
            },
            (error) => {
                // अगर यूज़र लोकेशन परमिशन Block कर दे, तो Default (Shahdara, Delhi) दिखाएगा
                console.log("Location permission denied, using default location.");
                fetchWeatherData(28.67, 77.28); 
            }
        );
    } else {
        // अगर ब्राउज़र लोकेशन सपोर्ट न करे
        fetchWeatherData(28.67, 77.28);
    }
}

// मौसम का डेटा API से लाने का फ़ंक्शन
async function fetchWeatherData(lat, lon) {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`;

    try {
        const response = await fetch(url);
        const data = await response.json();

        if (data && data.current_weather) {
            const temp = Math.round(data.current_weather.temperature);
            const weatherCode = data.current_weather.weathercode;

            const tempEl = document.getElementById('weather-temp');
            if (tempEl) tempEl.innerText = `${temp}°C`;

            let description = "साफ़ मौसम";
            let icon = "☀️";

            if (weatherCode === 0) {
                description = "साफ़ आसमान";
                icon = "☀️";
            } else if (weatherCode >= 1 && weatherCode <= 3) {
                description = "हल्के बादल";
                icon = "⛅";
            } else if (weatherCode >= 45 && weatherCode <= 48) {
                description = "धुंध / कोहरा";
                icon = "🌫️";
            } else if (weatherCode >= 51 && weatherCode <= 67) {
                description = "हल्की बारिश";
                icon = "🌧️";
            } else if (weatherCode >= 80 && weatherCode <= 82) {
                description = "तेज़ बारिश";
                icon = "🌧️⚡";
            } else if (weatherCode >= 95) {
                description = "आंधी / तूफान";
                icon = "⛈️";
            }

            const descEl = document.getElementById('weather-desc');
            const iconEl = document.getElementById('weather-icon');

            if (descEl) descEl.innerText = description;
            if (iconEl) iconEl.innerText = icon;
        }
    } catch (error) {
        console.error("Weather error:", error);
    }
}

// पेज लोड होते ही ऑटो-लोकेशन वेदर चालू करें
initAutoWeather();
    </script>
