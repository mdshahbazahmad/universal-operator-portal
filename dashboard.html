<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Universal Operator Portal</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>
:root{--primary:#38bdf8;--bg:#070a12;--sidebar:#0f172a;--panel:#111827;--text:#f8fafc;--muted:#cbd5e1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}.shell{height:100vh;display:flex}.sidebar{width:245px;background:var(--sidebar);padding:18px;display:flex;flex-direction:column;border-right:1px solid #ffffff1a}.brand{display:flex;align-items:center;gap:10px;padding-bottom:18px;border-bottom:1px solid #ffffff1a}.brand img{width:38px;height:38px;object-fit:cover;border-radius:50%}.links{display:grid;gap:8px;margin-top:18px}.links a,.logout{padding:11px 12px;border-radius:9px;text-decoration:none;color:var(--muted);background:#ffffff08}.links a:hover{color:var(--primary);background:#ffffff14}.sidebar-footer{margin-top:auto;color:var(--muted);font-size:.8rem}.logout{color:#fca5a5;border:0;cursor:pointer}.main{min-width:0;flex:1;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;padding:15px 22px;background:#0f172ae8;border-bottom:1px solid #ffffff1a}.operator{display:flex;align-items:center;gap:10px}.operator img{width:34px;height:34px;object-fit:cover;border-radius:50%}.content{flex:1;min-height:0}iframe{width:100%;height:100%;border:0;background:#0f172a}.powered{font-size:.72rem;color:#94a3b8;text-align:center;margin-top:12px}.menu{display:none}@media(max-width:700px){.sidebar{width:66px;padding:12px 8px}.brand span,.links a span,.sidebar-footer strong,.sidebar-footer .powered{display:none}.links a{text-align:center}.menu{display:block}.top{padding:12px}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand"><img id="sidebarLogo" src="https://i.ibb.co/cKBTN905/IMG-20260821-WA0005.jpg" alt="Brand"><span id="sidebarName">Eagle Network</span></div><nav class="links"><a href="modules/customers.html" target="portalFrame"><i class="fa fa-users"></i> <span>Customers</span></a><a href="modules/billing.html" target="portalFrame"><i class="fa fa-file-invoice-dollar"></i> <span>Billing</span></a><a href="modules/complaint.html" target="portalFrame"><i class="fa fa-headset"></i> <span>Complaints</span></a><a href="modules/workers.html" target="portalFrame"><i class="fa fa-people-group"></i> <span>Workers</span></a><a href="modules/settings.html" target="portalFrame"><i class="fa fa-gear"></i> <span>Branding & Settings</span></a></nav><div class="sidebar-footer"><strong id="accountName">Operator</strong><div id="accountEmail"></div><button class="logout" onclick="logout()">Sign out</button><div class="powered">Powered by Eagle Network</div></div></aside><main class="main"><header class="top"><div class="operator"><img id="headerLogo" src="https://i.ibb.co/cKBTN905/IMG-20260821-WA0005.jpg" alt="Logo"><strong id="headerName">Universal Operator Portal</strong></div><span class="menu"><i class="fa fa-bars"></i></span></header><div class="content"><iframe name="portalFrame" title="Portal modules" src="modules/customers.html"></iframe></div></main></div>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script><script>
const config={apiKey:'AIzaSyCVsmFa6Xr-_EfUqh_ZS6tmzBwcdMZq0JA',authDomain:'universal-portal-dashboard.firebaseapp.com',projectId:'universal-portal-dashboard',storageBucket:'universal-portal-dashboard.firebasestorage.app',messagingSenderId:'403036962443',appId:'1:403036962443:web:5a15ac684c76efd2c3de8e'};if(!firebase.apps.length)firebase.initializeApp(config);firebase.auth().onAuthStateChanged(user=>{if(!user){location.replace('index.html');return}document.getElementById('accountEmail').textContent=user.email||'';firebase.firestore().collection('operators').doc(user.uid).onSnapshot(doc=>{const b=doc.exists?doc.data():{};const name=b.companyName||'Eagle Network';document.title=name+' | Operator Portal';document.getElementById('headerName').textContent=name;document.getElementById('sidebarName').textContent=name;document.getElementById('accountName').textContent=name;for(const id of ['headerLogo','sidebarLogo'])if(b.logoUrl)document.getElementById(id).src=b.logoUrl;if(/^#[0-9a-f]{6}$/i.test(b.themeColor||''))document.documentElement.style.setProperty('--primary',b.themeColor)})});function logout(){firebase.auth().signOut().then(()=>location.replace('index.html'))}
</script></body></html>
